const HISTORIA = `
  <h2>Paltens historia</h2>
  <p class="ingress">Eller: hur en klump potatisdeg blev en hel stads stolthet.</p>
  <p>Palt är egentligen ganska enkelt. Riv potatis, blanda med mjöl, stoppa in en bit fläsk, koka länge och ät tills du inte kan röra dig. Men bakom den enkla klumpen finns flera hundra år av norrländsk envishet, sparsamhet och kärlek till smör.</p>

  <h3>I början var det mjöl</h3>
  <p>Exakt när någon först kokade en degklump och kallade den middag vet ingen. Vissa forskare tror att kokt deg kan vara en sorts förfader till brödet – lite som brödets mormor. Och palten är inte ensam i världen: liknande fyllda degknyten finns runt hela Östersjön, på de brittiska öarna och på många andra håll. Folk verkar helt enkelt ha kommit fram till samma geniala idé: deg + något gott inuti = lycka.</p>

  <h3>Kornet – norrlänningens bästa vän</h3>
  <p>Här uppe var kornet länge kung. Det tålde kyla, växte fort och gav rejäla skördar även när sommaren var lika kort som en semester. Vetemjöl var däremot lyx. Det blev vanligt i norr först när det odlades i stor skala i södra Sverige och kunde fraktas hela vägen upp. Fram till dess fick palten nöja sig med korn – och det gick alldeles utmärkt.</p>

  <h3>Blodpalten – inget fick gå till spillo</h3>
  <p>När man slaktade tog man vara på allt. Blodet blandades i mjölet och blev blodpalt: mörk, mättande och precis vad man behövde under den långa, mörka vintern. Den äts fortfarande i norra Sverige och Finland. Längst upp i norr används ibland renblod. Mer norrländskt än så blir det inte.</p>

  <h3>Sen kom potatisen</h3>
  <p>På 1700-talet slog potatisen igenom i Sverige och blev snabbt en basvara. Den hamnade förstås i palten också. Men – och det här är viktigt – den tog aldrig över helt. Mjölet fick vara kvar. Palten är en kompromiss mellan åker och potatisland, och kanske är det därför den är så god.</p>

  <h3>Pitepalten – rå potatis, tack</h3>
  <p>Pitepalten görs på råriven potatis. Det är den stora skillnaden mot kroppkakan längre söderut, som görs på kokt potatis och därför blir ljusare. Pitepalten är lite gråare, lite kompaktare och betydligt mer norrbottnisk. Den har fått sitt namn efter Piteå, och i Piteå tar man det namnet på största allvar.</p>

  <h3>Paltakademin och tävlingen</h3>
  <p>1995 grundades Paltakademin i Piteå – ja, det finns en akademi för palt – för att sprida och bevara paltkulturen. Varje år hålls dessutom en paltätartävling där vinnaren får palt för ett helt år. Det är ett pris man både vill och inte vill vinna, beroende på hur man mår just då.</p>

  <h3>Palt i dag</h3>
  <p>I Piteå och stora delar av Norrbotten är palt helt vardag. Den serveras i skolmatsalar, på restauranger och på sjukhus. Pitepalten finns också med i Institutet för språk och folkminnens inventering av levande kulturarv, så det är nästan officiellt: palt är kultur.</p>

  <h3>Så äter man palt (enligt alla som vet)</h3>
  <p>Dela palten. Lägg en klick smör i mitten och låt den smälta. Lingon vid sidan. Ett stort glas kall mjölk. Ät långsamt, även om det är svårt. Gör man palt utan fyllning, som flatpalt, ligger fläsket ofta vid sidan i stället. Och resterna? De steks i skivor dagen efter och är, enligt många, ännu godare.</p>

  <h3>Palt, kroppkaka, blodpalt – vad är skillnaden?</h3>
  <table class="rr">
    <tr><th>Sort</th><th>Rå potatis</th><th>Kokt potatis</th><th>Blod</th><th>Fyllning</th></tr>
    <tr><td><b>Pitepalt</b></td><td class="ja">✓</td><td></td><td></td><td>Fläsk</td></tr>
    <tr><td><b>Flatpalt</b></td><td class="ja">✓</td><td></td><td></td><td>Ingen</td></tr>
    <tr><td><b>Kroppkaka</b></td><td></td><td class="ja">✓</td><td></td><td>Fläsk och lök</td></tr>
    <tr><td><b>Blodpalt</b></td><td>Ibland</td><td></td><td class="ja">✓</td><td>Fläsk vid sidan</td></tr>
  </table>

  <h3>Ord du behöver kunna</h3>
  <p><b>Paltschwimen</b> – när du ätit en palt för mycket och kroppen plötsligt väger dubbelt. Ögonlocken också.<br>
  <b>Paltkoma</b> – samma sak, fast soffan är inblandad.<br>
  <b>Smör i hålet</b> – inte ett tips. En regel.</p>
  <p class="kallor">Fakta från Institutet för språk och folkminnen (Levande kulturarv: pitepalt) och Wikipedia (Palt, Blodpalt). Texten är skriven för Paltboken.</p>`;

/* ---------- Visning ---------- */
const sida = document.getElementById("sida");
const e = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const portionerFor = {};

function format(tal) {
  if (tal >= 100) return String(Math.round(tal / 10) * 10);
  const r = Math.round(tal * 4) / 4;
  const hel = Math.floor(r), rest = r - hel;
  const br = { 0.25: "¼", 0.5: "½", 0.75: "¾" }[rest] || "";
  return (hel ? String(hel) : "") + (br ? (hel ? " " : "") + br : (hel ? "" : "0"));
}

function visaLista() {
  const grupper = [...new Set(RECEPT.map((r) => r.grupp))];
  sida.innerHTML = grupper.map((g) => `<h2 class="grupp">${e(g)}</h2><div class="lista">${RECEPT.filter((r) => r.grupp === g).map((r) => `
    <button class="receptkort" data-recept="${r.id}"><span class="emoji" aria-hidden="true">${r.emoji}</span><b>${e(r.namn)}</b><span>${e(r.kort)}</span>
      <span class="etiketter">${r.etiketter.map(([t, k]) => `<span class="etikett ${k}">${e(t)}</span>`).join("")}</span></button>`).join("")}</div>`).join("");
}

function visaRecept(id) {
  const r = RECEPT.find((x) => x.id === id); if (!r) return visaLista();
  const n = portionerFor[id] || r.portioner, k = n / r.portioner;
  const steg1 = r.enhet === "liter" ? 0.5 : 1;
  sida.innerHTML = `<article class="recept">
    <button class="tillbaka" data-tillbaka>← Alla recept</button>
    <div><h2>${r.emoji} ${e(r.namn)}</h2><p class="ingress">${e(r.ingress)}</p></div>
    <div class="fakta">${r.tid ? `<div><b>Tid</b>${e(r.tid)}</div>` : ""}${r.ger && n === r.portioner ? `<div><b>Ger</b>${e(r.ger)}</div>` : ""}<div><b>Redskap</b>${r.redskap.length} st</div></div>
    <section class="del"><h3>Ingredienser
      <span class="portioner"><button data-port="-${steg1}" aria-label="Färre">−</button><span>${format(n)} ${e(r.enhet)}</span><button data-port="${steg1}" aria-label="Fler">+</button></span></h3>
      <ul class="bock">${r.ingredienser.map(([m, enh, namn], i) => `<li><label><input type="checkbox" data-bock="i${i}"><span><span class="mangd">${format(m * k)} ${e(enh)}</span> ${e(namn)}</span></label></li>`).join("")}</ul>
    </section>
    <section class="del"><h3>Redskap</h3><div class="redskap">${r.redskap.map((x) => `<span>${e(x)}</span>`).join("")}</div></section>
    <section class="del"><h3>Gör så här</h3>
      <ol class="steg">${r.steg.map((s, i) => `<li><label><input type="checkbox" data-bock="s${i}"><span>${e(s)}</span></label></li>`).join("")}</ol>
    </section>
    ${r.tips.map(([t, s]) => `<div class="tips"><b>${e(t)}</b>${e(s)}</div>`).join("")}
  </article>`;
  // Bockar sparas medan man lagar
  const nyckel = "paltboken_" + id;
  let sparat = {};
  try { sparat = JSON.parse(sessionStorage.getItem(nyckel) || "{}"); } catch (_) {}
  sida.querySelectorAll("[data-bock]").forEach((b) => {
    b.checked = !!sparat[b.dataset.bock];
    b.addEventListener("change", () => { sparat[b.dataset.bock] = b.checked; try { sessionStorage.setItem(nyckel, JSON.stringify(sparat)); } catch (_) {} });
  });
}

function visaRedskap() {
  const alla = {};
  for (const r of RECEPT) for (const x of r.redskap) (alla[x] = alla[x] || []).push(r);
  sida.innerHTML = `<div class="text"><h2>Redskap</h2><p class="ingress">Vad du behöver till respektive recept. Tryck på ett recept för att öppna det.</p></div>
    ${RECEPT.map((r) => `<section class="del" style="margin-top:12px"><h3>${r.emoji} ${e(r.namn)} <button class="tillbaka" style="margin-left:auto;padding:5px 12px;font-size:14px" data-recept="${r.id}">Öppna</button></h3>
      <div class="redskap">${r.redskap.map((x) => `<span>${e(x)}</span>`).join("")}</div></section>`).join("")}`;
}

function visa(flik, recept) {
  document.querySelectorAll("[data-flik]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.flik === flik)));
  if (flik === "historia") sida.innerHTML = `<div class="text">${HISTORIA}</div>`;
  else if (flik === "redskap") visaRedskap();
  else if (recept) visaRecept(recept);
  else visaLista();
}
function fran() { const [flik, recept] = location.hash.replace(/^#\/?/, "").split("/"); visa(flik || "recept", recept); }
window.addEventListener("hashchange", () => { fran(); window.scrollTo({ top: document.querySelector("nav.flikar").offsetTop, behavior: "smooth" }); });

document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-flik],[data-recept],[data-tillbaka],[data-port]");
  if (!t) return;
  if (t.dataset.flik) location.hash = "#/" + t.dataset.flik;
  else if (t.dataset.recept) location.hash = "#/recept/" + t.dataset.recept;
  else if (t.hasAttribute("data-tillbaka")) location.hash = "#/recept";
  else if (t.dataset.port) {
    const id = location.hash.split("/")[2], r = RECEPT.find((x) => x.id === id);
    const n = Math.max(r.enhet === "liter" ? 0.5 : 1, Math.min(20, (portionerFor[id] || r.portioner) + Number(t.dataset.port)));
    portionerFor[id] = n; visaRecept(id);
  }
});
fran();
</script>
</body>
</html>
