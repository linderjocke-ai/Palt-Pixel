<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Digital julkalender för F–6 med en julberättelse i 14 kapitel, luckor för hela klassen och kopieringsmaterial.">
<title>Julkalendern – Palt &amp; pixel</title>
<style>@font-face{font-family:Andika;font-weight:400;font-display:swap;src:url(fonts/andika-latin-400-normal.woff2) format("woff2")}@font-face{font-family:Andika;font-weight:700;font-display:swap;src:url(fonts/andika-latin-700-normal.woff2) format("woff2")}@font-face{font-family:Fredoka;font-weight:500;font-display:swap;src:url(fonts/fredoka-latin-500-normal.woff2) format("woff2")}@font-face{font-family:Fredoka;font-weight:600;font-display:swap;src:url(fonts/fredoka-latin-600-normal.woff2) format("woff2")}@font-face{font-family:Fredoka;font-weight:700;font-display:swap;src:url(fonts/fredoka-latin-700-normal.woff2) format("woff2")}</style>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
/* VOICE: lugn, varm, mysig – en klassrumskalender på storbild.
   IDEA: två levande världar – en isometrisk miniatyrby och en målad sagobok – där luckorna lever i bilden.
   PICTURE: hela 16:9-scenen är bilden; kapitlen får egna målade bilder.
   COLOUR and TYPE: nattblå, papperskräm, julröd, ljusgult, granngrönt; Fredoka + Andika.
   LAYOUT: fast 1600×900-scen som skalas till skärmen; paneler öppnas ovanpå. */
:root{--night:#16213f;--paper:#f7f1e6;--cream:#fffaf0;--red:#c23a2b;--red2:#7b1f17;--gold:#f2b33d;--gold2:#ffd27a;--pine:#2d5e48;--ink:#1b2747;--soft:#5b6683;color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#0b1024;overflow:hidden;font-family:Andika,system-ui,sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible,[contenteditable]:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
h1,h2,h3{font-family:Fredoka,system-ui,sans-serif;margin:0;line-height:1.08;text-wrap:balance}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--k,1));overflow:hidden;background:#0b1533}
#world{position:absolute;inset:0;transform-origin:0 0;transition:transform 1.05s cubic-bezier(.7,0,.2,1)}
#world svg.bg{position:absolute;inset:0;width:1600px;height:900px;display:block}
.hs{position:absolute;inset:0}
#snow{position:absolute;inset:0;pointer-events:none;z-index:4}
#ui{position:absolute;inset:0;pointer-events:none;z-index:5;transition:opacity .45s}
#ui>*{pointer-events:auto}
#ui .top{pointer-events:none}#ui .top>*{pointer-events:auto}
#fly{position:absolute;inset:0;z-index:20;pointer-events:none}
#fly>*{pointer-events:auto}
#ovl,#ovl2{position:absolute;inset:0;z-index:40;pointer-events:none}#ovl2{z-index:45}
#ovl>*,#ovl2>*{pointer-events:auto}
#onb{position:absolute;inset:0;z-index:30;pointer-events:none}#onb>*{pointer-events:auto}
.hide{display:none!important}

/* ---------- svg-animationer ---------- */
.smk{animation:smk 8s linear infinite;opacity:0}
@keyframes smk{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:.6}100%{transform:translate(28px,-150px) scale(2.4);opacity:0}}
.flk{animation:flk 5s ease-in-out infinite}
@keyframes flk{0%,100%{opacity:1}40%{opacity:.82}60%{opacity:.95}70%{opacity:.78}}
.bob{animation:bob 7s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.aur{animation:aur 16s ease-in-out infinite alternate}
@keyframes aur{from{transform:translateX(-60px) skewX(-6deg)}to{transform:translateX(60px) skewX(6deg)}}
.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.head2{animation:hd 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes hd{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-8deg)}85%{transform:rotate(5deg)}}
.breath{animation:br 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes br{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,1.04)}}
.flame{animation:fl .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.14)}}
.knit{animation:knit .6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes knit{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.fall{animation:fall 9s linear infinite}
@keyframes fall{from{transform:translateY(-620px)}to{transform:translateY(20px)}}
.flap{animation:flap .35s ease-in-out infinite alternate;transform-box:view-box}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.7)}}
.hop{animation:hop2 3.4s ease-in-out infinite}
@keyframes hop2{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-40px)}}
.drift{animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(-40px,20px)}to{transform:translate(40px,-20px)}}
.wag{animation:wag .5s ease-in-out infinite alternate;transform-box:view-box}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.blink{animation:blink 5s infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.shoot{stroke-dasharray:420;animation:shoot 4s ease-in infinite}
@keyframes shoot{0%{stroke-dashoffset:420;opacity:1}50%{stroke-dashoffset:0;opacity:1}80%,100%{stroke-dashoffset:0;opacity:0}}
.sway{animation:sway 4s ease-in-out infinite alternate;transform-origin:400px 600px}
@keyframes sway{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
.slide{animation:slide 4s ease-in-out infinite}
@keyframes slide{0%{transform:translate(-40px,-10px)}60%{transform:translate(160px,34px)}100%{transform:translate(-40px,-10px)}}
.shiver{animation:shiver .25s linear infinite alternate}
@keyframes shiver{from{transform:translateX(-1.5px)}to{transform:translateX(1.5px)}}
.rise{animation:rise 6s ease-in-out infinite alternate}
@keyframes rise{from{transform:translateY(40px)}to{transform:translateY(-20px)}}
.toss{animation:toss 1.8s ease-out infinite}
@keyframes toss{from{transform:translate(0,0);opacity:1}to{transform:translate(0,-70px);opacity:0}}
.steam{animation:toss 3s ease-out infinite}
.swing{animation:sw 2.6s ease-in-out infinite alternate}
.dash{stroke-dasharray:10 7;animation:dsh 3s linear infinite}
@keyframes dsh{to{stroke-dashoffset:-34}}

/* ---------- topbar ---------- */
.top{position:absolute;left:46px;right:46px;top:30px;display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.ttl h1{font-size:48px;font-weight:700}
.ttl .d{font-size:23px;margin-top:6px;max-width:560px;line-height:1.3}
.tools{display:flex;gap:12px;align-items:center}
.tbtn{display:flex;align-items:center;gap:10px;height:60px;padding:0 22px;border-radius:18px;font-family:Fredoka;font-weight:600;font-size:21px;position:relative}
.tbtn svg{flex:none}
.tbtn.sq{width:60px;padding:0;justify-content:center}
.count{border-radius:18px;padding:7px 18px;text-align:center;line-height:1.05;min-height:60px;display:flex;flex-direction:column;justify-content:center}
.count b{display:block;font-family:Fredoka;font-weight:700;font-size:30px}
.count span{font-size:14px}
.banner{position:absolute;left:46px;top:150px;border-radius:18px;padding:10px 12px 10px 22px;font-size:20px;display:flex;gap:16px;align-items:center;background:rgba(255,250,240,.95);color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.2)}
.banner button{background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-family:Fredoka;font-weight:600;font-size:18px}

/* byn – isometrisk */
[data-theme=byn] .ttl{color:#fff}[data-theme=byn] .ttl .d{color:#c8d6f5}[data-theme=byn] .ttl b{color:var(--gold2)}
[data-theme=byn] .tbtn,[data-theme=byn] .count{background:rgba(255,255,255,.16);backdrop-filter:blur(8px);color:#fff;border:1.5px solid rgba(255,255,255,.32)}
[data-theme=byn] .count b{color:var(--gold2)}
.bd{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;z-index:2}
.bd .no{width:var(--b);height:var(--b);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Fredoka;font-weight:700;font-size:calc(var(--b)*.5);background:rgba(255,255,255,.92);color:#1e2f5c;box-shadow:0 3px 0 rgba(0,0,0,.28);transition:transform .2s}
.bd .nm{position:absolute;top:calc(var(--b) + 3px);font-size:15px;font-weight:700;border-radius:7px;padding:1px 8px;white-space:nowrap;background:rgba(20,30,60,.82);color:#fff;display:none}
.bd.today .no{background:var(--gold2);animation:pl 2.4s ease-in-out infinite}
.bd.today .nm{display:block;background:var(--gold2);color:var(--ink)}
.bd.open .no{background:#ffe3a3;color:#8a4a12}
.bd.missed .no{background:#c7d6ff;box-shadow:0 0 0 3px #ffd27a,0 3px 0 rgba(0,0,0,.28)}
.bd.locked .no{background:rgba(255,255,255,.55);color:#2b3b66}
.bd:hover .no{transform:scale(1.12)}.bd:hover .nm{display:block}
@keyframes pl{0%,100%{box-shadow:0 0 0 4px rgba(255,210,122,.95),0 0 18px 6px rgba(255,210,122,.6)}50%{box-shadow:0 0 0 7px rgba(255,210,122,.95),0 0 38px 16px rgba(255,210,122,.8)}}
.moonbtn{position:absolute;left:56px;top:640px;width:214px;height:214px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:radial-gradient(circle at 40% 35%,#fff6d8,#ffd77a 62%,#f0b44a);color:#1e2f5c;box-shadow:0 0 60px 18px rgba(255,215,122,.35);animation:moonG 7s ease-in-out infinite;text-align:center}
@keyframes moonG{0%,100%{box-shadow:0 0 50px 14px rgba(255,215,122,.3)}50%{box-shadow:0 0 80px 28px rgba(255,215,122,.45)}}
.moonbtn b{font-family:Fredoka;font-size:25px;line-height:1}
.moonbtn span{font-size:15px;max-width:160px;line-height:1.15}

/* filt – sagobok */
[data-theme=filt] .ttl{color:#fff8ec;text-shadow:0 2px 12px rgba(40,20,10,.5)}[data-theme=filt] .ttl .d{color:#f6dcc8}[data-theme=filt] .ttl b{color:var(--gold2)}
[data-theme=filt] .tbtn,[data-theme=filt] .count{background:#fff8ec;color:#3b2f4a;box-shadow:0 4px 0 rgba(60,30,20,.3)}
[data-theme=filt] .count b{color:#a3392c}
.pk{position:absolute;transform-origin:50% 0}
.pk .in{position:absolute;inset:0;animation:sw var(--d,5s) ease-in-out infinite alternate;animation-delay:var(--dl,0s);transform-origin:50% 0}
@keyframes sw{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.pk .pin{position:absolute;left:50%;top:-14px;width:12px;height:28px;margin-left:-6px;background:#d8b07a;border-radius:3px;z-index:2;box-shadow:inset -3px 0 0 #b38a57}
.pk .body,.flip .body{position:absolute;inset:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1.5px),radial-gradient(rgba(0,0,0,.08) 1px,transparent 1.5px);background-size:6px 6px,9px 9px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15),inset 0 -14px 20px rgba(0,0,0,.18),0 8px 12px rgba(30,10,0,.35);transition:transform .2s}
.pk .body::before,.flip .body::before{content:"";position:absolute;inset:7px;border:2.5px dashed rgba(255,255,255,.55);border-radius:10px}
.pk .body b,.flip .body b{font-family:Fredoka;font-weight:700;color:#fff;line-height:1;position:relative;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.pk .tag,.flip .tag{position:relative;background:#fffaf0;color:#1b2747;font-weight:700;border-radius:6px;padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk.open .body .st,.flip .body .st{position:absolute;left:0;right:0;top:0;height:30%;background:rgba(0,0,0,.22);border-radius:16px 16px 50% 50%}
.pk.open .body{filter:saturate(.75) brightness(.92)}
.pk.today .body{box-shadow:0 0 0 5px var(--gold2),0 0 34px 12px rgba(255,200,90,.6);animation:pulse2 2.6s ease-in-out infinite}
@keyframes pulse2{0%,100%{box-shadow:0 0 0 5px var(--gold2),0 0 26px 6px rgba(255,200,90,.45)}50%{box-shadow:0 0 0 7px var(--gold2),0 0 52px 18px rgba(255,200,90,.7)}}
.pk.missed .body{box-shadow:0 0 0 4px rgba(255,248,236,.85),0 8px 12px rgba(30,10,0,.35)}
.pk.locked .body{filter:saturate(.8) brightness(.85)}
.pk:hover .body{transform:translateY(-4px)}
.oppna{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);background:var(--gold2);color:var(--ink);font-family:Fredoka;font-weight:700;font-size:17px;border-radius:10px;padding:2px 12px;white-space:nowrap;animation:hop 2.6s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-4px)}}
.feltbtn{position:absolute;left:1200px;top:118px;width:354px;height:118px;border-radius:20px;background:#a3392c;color:#fff;display:flex;align-items:center;gap:16px;padding:0 22px;box-shadow:0 8px 0 #6e1f17,0 14px 24px rgba(30,10,0,.35);animation:bob2 6s ease-in-out infinite;text-align:left}
.feltbtn::before{content:"";position:absolute;inset:8px;border:2.5px dashed rgba(255,255,255,.5);border-radius:14px;pointer-events:none}
@keyframes bob2{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-5px) rotate(1deg)}}
.feltbtn b{font-family:Fredoka;font-size:27px;display:block;line-height:1}
.feltbtn span span{font-size:16px;display:block;margin-top:4px;line-height:1.15}
.feltbtn svg,.moonbtn svg{flex:none}

.shake{animation:shake .45s!important}
@keyframes shake{0%,100%{translate:0}20%{translate:-8px}40%{translate:8px}60%{translate:-6px}80%{translate:6px}}
.toast{position:absolute;left:50%;bottom:40px;transform:translate(-50%,30px);background:var(--cream);color:var(--ink);font-size:22px;font-weight:700;padding:14px 26px;border-radius:18px;box-shadow:0 8px 0 rgba(0,0,0,.25);opacity:0;transition:.3s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- luckkort ---------- */
.dim{position:absolute;inset:0;background:rgba(5,10,30,.5);transition:opacity .4s}
.card{position:absolute;left:400px;top:170px;width:800px;height:560px;border-radius:32px;padding:42px 50px 36px;display:flex;flex-direction:column}
.dim.soft{background:linear-gradient(90deg,rgba(5,10,30,0) 0,rgba(5,10,30,.15) 35%,rgba(5,10,30,.55) 60%)}
.burst{position:absolute;left:400px;top:480px;width:10px;height:10px;border-radius:50%;box-shadow:0 0 60px 40px rgba(255,214,122,.55);animation:burst 2.4s ease-in-out infinite;transform:translate(-50%,-50%)}
@keyframes burst{0%,100%{box-shadow:0 0 50px 30px rgba(255,214,122,.45)}50%{box-shadow:0 0 90px 60px rgba(255,214,122,.7)}}
.card.byncard{left:740px;width:800px;background:linear-gradient(160deg,#fff,#eef3ff);color:#1e2f5c;box-shadow:0 30px 80px rgba(0,10,40,.5);border:2px solid #fff;transform:scale(.4);opacity:0;transition:transform .45s cubic-bezier(.2,1.3,.4,1),opacity .3s}
.card.byncard.on{transform:scale(1);opacity:1}
.card.feltcard{left:0;top:0;width:100%;height:100%;background:#fbf3e4;color:#3b2f4a;box-shadow:0 26px 60px rgba(40,20,40,.45)}
.card.feltcard::before{content:"";position:absolute;inset:14px;border:2px solid #d9c3a3;border-radius:22px;pointer-events:none}
.card.static{position:relative;left:auto;top:auto;width:800px;height:560px}
.cardin{display:flex;flex-direction:column;gap:16px;height:100%;position:relative}
.chead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.who{font-family:Fredoka;font-weight:600;font-size:22px;color:#c23a2b}
.chip{display:inline-block;border-radius:999px;padding:4px 16px;font-size:17px;font-weight:700;color:#fff}
.chip.sm{font-size:13px;padding:2px 10px}
.cmid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;min-height:0}
.cmid h3{font-weight:700;line-height:1.15;border-radius:14px;padding:4px 8px;margin:0 -8px}
.cmid h3.editing{background:#fff;box-shadow:0 0 0 3px var(--gold);outline:none;cursor:text}
.svar{font-size:32px;font-family:Fredoka;font-weight:600;color:var(--pine);background:#e6efe8;border-radius:18px;padding:14px 22px}
.crow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lnk{display:inline-flex;align-items:center;gap:8px;font-size:17px;font-weight:700;color:var(--soft);padding:10px 12px;border-radius:12px}
.lnk:hover{background:rgba(0,0,0,.06)}
.edhint{font-size:17px;color:var(--soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:0 26px;border-radius:18px;font-family:Fredoka;font-weight:600;font-size:22px}
.btn svg{flex:none}
.btn.main{background:#1e2f5c;color:#fff;box-shadow:0 5px 0 #0f1a38}
.feltcard .btn.main,[data-theme=filt] .btn.main{background:#a3392c;box-shadow:0 5px 0 #6e1f17}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 5px 0 #b07d1c}
.btn.light{background:#e6ecfa;color:#1e2f5c}
.feltcard .btn.light{background:#efe2cb;color:#3b2f4a}
.btn.red{background:var(--red);color:#fff;box-shadow:0 5px 0 var(--red2)}
.btn.playing{background:#1e2f5c;color:#fff}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.flip{position:absolute;perspective:1800px}
.flip.go{transition:left .8s cubic-bezier(.6,0,.2,1),top .8s cubic-bezier(.6,0,.2,1),width .8s cubic-bezier(.6,0,.2,1),height .8s cubic-bezier(.6,0,.2,1)}
.flip .fx{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.5,0,.2,1)}
.flip.turn .fx{transform:rotateY(180deg)}
.flip .ff,.flip .fb{position:absolute;inset:0;backface-visibility:hidden}
.flip .fb{transform:rotateY(180deg)}
.flip .body b{font-size:150px!important}.flip .body .tag{font-size:30px!important;max-width:90%!important}

/* ---------- paneler ---------- */
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,12,28,.62);backdrop-filter:blur(3px);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.panel{background:var(--cream);border-radius:30px;box-shadow:0 16px 0 rgba(0,0,0,.3);position:relative;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.88);opacity:0}}
.x{position:absolute;right:22px;top:22px;width:56px;height:56px;border-radius:50%;background:#ece3d2;display:flex;align-items:center;justify-content:center;z-index:3}
.muted{font-size:19px;color:var(--soft)}

/* läsare */
.reader{width:1540px;height:860px;display:flex;flex-direction:column;overflow:hidden;background:#fbf5e9}
.rhead{display:flex;align-items:center;gap:26px;padding:22px 100px 16px 40px;border-bottom:2px solid #eadfca}
.rt{display:flex;flex-direction:column;flex:none;max-width:420px}
.rt b{font-family:Fredoka;font-size:26px;line-height:1.1}
.rt span{font-size:16px;color:var(--soft)}
.chs{display:flex;gap:8px;flex-wrap:wrap;flex:1;justify-content:flex-end}
.chb{width:50px;height:50px;border-radius:50%;background:#ece3d2;font-family:Fredoka;font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center}
.chb.on{background:#1e2f5c;color:#fff;box-shadow:0 0 0 4px var(--gold2)}
.chb.lock{opacity:.45;cursor:not-allowed}
.rbody{flex:1;display:grid;grid-template-columns:640px minmax(0,1fr);min-height:0}
.rleft{padding:26px 34px 26px 40px;display:flex;flex-direction:column;gap:12px;border-right:2px solid #eadfca;min-height:0}
.pic{width:566px;height:424px;border-radius:22px;overflow:hidden;box-shadow:0 10px 26px rgba(40,20,40,.25);flex:none;background:#c9b8c6}
.pic svg{width:100%;height:100%;display:block}
.rk{font-family:Fredoka;font-weight:600;font-size:19px;color:#a3392c;margin-top:6px}
.rleft h2{font-size:40px;border-radius:12px;padding:2px 8px;margin:-2px -8px;transition:background .3s;cursor:pointer}
.rbar{display:flex;gap:12px;align-items:center;margin-top:auto}
.btn.big{min-height:64px;font-size:24px;padding:0 30px}
.size{display:flex;gap:6px}
.size button{width:58px;height:58px;border-radius:16px;background:#ece3d2;font-family:Fredoka;font-weight:700;font-size:20px}
.rtext{padding:30px 60px 30px 46px;overflow:auto;position:relative}
.rtext p{font-size:var(--rf,30px);line-height:1.6;margin:0 0 .7em;max-width:30em;transition:background .3s;border-radius:10px;padding:2px 10px;margin-left:-10px;cursor:pointer}
.rtext p:hover{background:rgba(255,210,122,.18)}
.reading{background:#fbe1a0!important}
.rnav{display:flex;justify-content:space-between;gap:14px;margin-top:20px}

/* kopiering */
.kop{width:1440px;height:820px;padding:44px 50px;display:flex;flex-direction:column;gap:18px}
.kop h2{font-size:44px}
.kop .sub{font-size:20px;color:var(--soft)}
.kgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:18px;overflow:auto;padding:6px 6px 20px}
.kcard{display:flex;flex-direction:column;gap:8px;text-align:left;border-radius:14px;padding:8px;transition:background .2s}
.kcard:hover{background:#efe6d4}
.kcard img{width:100%;aspect-ratio:210/297;object-fit:cover;border-radius:8px;box-shadow:0 2px 0 rgba(0,0,0,.08),0 6px 18px rgba(20,30,60,.14);background:#fff}
.kcard b{font-family:Fredoka;font-weight:600;font-size:17px;line-height:1.1}
.kcard span{font-size:14px;color:var(--soft);line-height:1.2}
.kcard .pdf{font-size:13px;color:var(--red);font-weight:700}
.kcard.today img{outline:4px solid var(--gold);outline-offset:2px}

.kcard.bokc img{aspect-ratio:148/210;outline:3px solid var(--red);outline-offset:2px}
.bokd{width:1300px;height:820px;padding:44px 50px;display:flex;flex-direction:column;gap:10px}
.bokd h2{font-size:44px}.bokd .sub{font-size:20px;color:var(--soft)}
.bokd .bokback{align-self:flex-start;font-size:17px;color:var(--soft);font-weight:700;margin:-14px 0 -2px}
.bokw{display:grid;grid-template-columns:420px 1fr;gap:50px;margin-top:14px;min-height:0}
.bokprev{position:relative;width:420px;aspect-ratio:148/210;border-radius:10px;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.08),0 14px 34px rgba(20,30,60,.22);align-self:start}
.bokprev img{width:100%;height:100%;display:block}
.bokg{position:absolute;left:8.1%;right:8.1%;top:78.1%;height:12.4%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Fredoka;font-weight:600;color:#fff;font-size:20px;line-height:1.1;padding:0 26px;background:#b23a2e;border-radius:8px}
.bokc2 h3{font-family:Fredoka;font-weight:600;font-size:22px;margin:4px 0 10px}
.gopts{display:flex;gap:10px;flex-wrap:wrap}
.gopts button{padding:12px 18px;border-radius:999px;background:#efe6d4;font-weight:700;font-size:17px}
.gopts button.on{background:var(--red);color:#fff}
.fl{display:flex;flex-direction:column;gap:6px;margin:14px 0 26px;font-weight:700;font-size:16px}
.fl input{font:inherit;font-weight:400;font-size:20px;padding:12px 16px;border-radius:12px;border:2px solid #d9cdb6;background:#fff;max-width:520px}
.bokbtn{display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;max-width:640px;padding:16px 20px;border-radius:16px;background:#efe6d4;margin-bottom:12px}
.bokbtn b{font-family:Fredoka;font-weight:600;font-size:21px}.bokbtn span{font-size:16px;color:var(--soft);line-height:1.3}
.bokbtn.main{background:var(--red);color:#fff}.bokbtn.main span{color:rgba(255,255,255,.85)}
.bokbtn:disabled{opacity:.55}
.bokst{font-weight:700;font-size:17px;min-height:24px}
.soon{display:flex;gap:10px;align-items:center;flex:1;font-size:15px;line-height:1.3;color:var(--soft);font-weight:700}.soon svg{flex:none;width:22px;height:22px;opacity:.6}
.onbcard .plot{background:rgba(255,215,130,.16);border:1.5px solid rgba(255,215,130,.45);border-radius:20px;padding:16px 20px;color:#fff}.onbcard .plot b{font-family:Fredoka;font-weight:600;font-size:18px;display:block;margin-bottom:4px;color:#ffd27a}.onbcard .plot p{margin:0;font-size:15.5px;line-height:1.45;color:#fff}
#tour{position:absolute;inset:0;z-index:200;pointer-events:none}
.tspot{position:absolute;border-radius:16px;box-shadow:0 0 0 2000px rgba(8,12,30,.55),0 0 0 4px #ffd27a;transition:all .55s cubic-bezier(.3,.8,.3,1);opacity:0}
.tcap{position:absolute;width:450px;background:#fffaf0;color:#1b2747;border-radius:18px;padding:18px 22px 14px;box-shadow:0 14px 40px rgba(0,0,0,.3);transition:left .55s,top .55s;pointer-events:auto}
.tcap #tTxt{font-family:Fredoka;font-weight:600;font-size:22px;line-height:1.25;display:block}
.tbar{height:5px;background:#eee3cf;border-radius:3px;margin:14px 0 8px;overflow:hidden}.tbar i{display:block;height:100%;width:0;background:#c23a2b}
.trow{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#6b7086;font-weight:700}
.trow button{font-weight:700;font-size:15px;color:#c23a2b;padding:4px 0}
/* inställningar */
.set{width:1260px;height:820px;display:grid;grid-template-columns:290px minmax(0,1fr);overflow:hidden}
.snav{background:#efe6d4;padding:40px 18px;display:flex;flex-direction:column;gap:6px}
.snav h3{font-size:30px;margin:0 10px 16px}
.snav button{text-align:left;padding:13px 16px;border-radius:14px;font-family:Fredoka;font-weight:600;font-size:20px}
.snav button.on{background:var(--ink);color:#fff}
.sbody{padding:46px 56px 46px;overflow:auto;display:flex;flex-direction:column;gap:18px}
.sbody h2{font-size:38px}.sbody .h2s{font-size:27px;margin-top:12px}
.sbody p{font-size:19px;color:var(--soft);margin:0;max-width:42em;line-height:1.45}
textarea{width:100%;font:inherit;font-size:21px;line-height:1.5;border:2px solid #d9cdb6;border-radius:16px;padding:14px 18px;background:#fff;resize:none;color:var(--ink)}
select{font:inherit;font-size:20px;padding:10px 14px;border-radius:14px;border:2px solid #d9cdb6;background:#fff;min-height:56px;color:var(--ink)}
.gmini{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.gmini button{background:#fff;border:2px solid #e3d8c2;border-radius:18px;padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.gmini b{font-family:Fredoka;font-size:44px;line-height:1;color:var(--red)}.gmini span{font-size:13px}
.gmini button.on{background:var(--gold2);border-color:var(--gold)}
.stepper{display:flex;align-items:center;gap:22px}
.stepper button{width:76px;height:76px;border-radius:50%;font-family:Fredoka;font-weight:700;font-size:46px;flex:none}
.stepper .num{font-family:Fredoka;font-weight:700;font-size:84px;min-width:150px;text-align:center;line-height:1}
.stepper.dark button{background:#1e2f5c;color:#fff}
.pvrow{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.sel{display:flex;align-items:center;gap:12px;font-size:19px;color:var(--soft)}
.llist{display:flex;flex-direction:column;gap:8px}
.li{display:grid;grid-template-columns:70px 150px 130px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:#fff;border:2px solid #ece2cf;border-radius:14px;padding:10px 16px;font-size:17px}
.li:hover{border-color:var(--gold)}
.ld{font-family:Fredoka;font-weight:700;color:var(--red)}.ln{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lt{color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li .chip{justify-self:start}
.led{background:#e6efe8;color:var(--pine);font-weight:700;font-size:13px;border-radius:999px;padding:2px 10px}
.about{display:flex;flex-direction:column;gap:16px}
.pp{display:flex;gap:20px;align-items:center;background:#fff;border:2px solid #ece2cf;border-radius:22px;padding:22px 26px}
.ppmark{width:86px;height:86px;border-radius:22px;background:#1e2f5c;display:flex;align-items:center;justify-content:center;flex:none}
.pp b{font-family:Fredoka;font-size:28px;display:block}.pp span{display:block;color:var(--soft);font-size:18px}
.pp a{color:#a3392c;font-weight:700;font-size:19px}

/* temakort och innehållskort */
.tcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px;margin-top:22px}
.tcard{background:#fff;color:var(--ink);border-radius:26px;padding:14px 14px 20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 0 rgba(0,0,0,.2);transition:transform .2s,box-shadow .2s;text-align:left}
.tcard:hover{transform:translateY(-4px)}
.tcard.on{box-shadow:0 0 0 7px var(--gold2),0 8px 0 rgba(0,0,0,.2);transform:translateY(-4px)}
.tcard .pv{display:block;height:268px;border-radius:16px;overflow:hidden}
.tcard .pv svg{width:100%;height:100%;display:block}
.tcard b{font-family:Fredoka;font-weight:700;font-size:30px;padding:0 8px}
.tcard .ds{font-size:17px;color:var(--soft);padding:0 8px;line-height:1.35}
.tcards.in .tcard{border:2px solid #ece2cf;box-shadow:none}.tcards.in .tcard.on{box-shadow:0 0 0 6px var(--gold2)}.tcards.in .pv{height:220px}
.ccards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:22px}
.ccard{background:#fff;color:var(--ink);border-radius:24px;padding:22px;display:flex;gap:18px;align-items:flex-start;text-align:left;box-shadow:0 7px 0 rgba(0,0,0,.2);transition:transform .2s,box-shadow .2s}
.ccard:hover{transform:translateY(-3px)}
.ccard.on{box-shadow:0 0 0 6px var(--gold2),0 7px 0 rgba(0,0,0,.2)}
.ccard .ci{width:68px;height:68px;border-radius:20px;display:flex;align-items:center;justify-content:center;flex:none}
.ccard .ct{display:flex;flex-direction:column;gap:4px}
.ccard b{font-family:Fredoka;font-size:28px;line-height:1.05}
.ccard .ct>span{font-size:17px;color:var(--soft)}
.ccard i{font-size:16px;color:#7a6a5a;margin-top:6px;font-style:italic}
.ccard.lt{border:2px solid #ece2cf;box-shadow:none}.ccard.lt.on{box-shadow:0 0 0 6px var(--gold2)}

/* ---------- startguide ---------- */
.onbcard{position:absolute;left:64px;top:56px;width:760px;max-height:790px;padding:38px 42px 32px;border-radius:34px;display:flex;flex-direction:column;gap:14px;background:rgba(255,255,255,.13);backdrop-filter:blur(16px) saturate(1.2);border:1.5px solid rgba(255,255,255,.35);color:#fff;box-shadow:0 30px 70px rgba(0,10,40,.35);animation:popin .45s cubic-bezier(.2,1.3,.4,1)}
.onbcard.wide{width:1100px}
@keyframes popin{from{transform:translateY(16px) scale(.97);opacity:0}}
.onbcard .dots{display:flex;gap:8px}.onbcard .dots i{width:40px;height:7px;border-radius:4px;background:rgba(255,255,255,.3)}.onbcard .dots i.on{background:var(--gold2)}
.onbcard h1{font-size:50px;margin-top:8px}
.onbcard .lead{font-size:21px;line-height:1.4;margin:0;color:#dfe7fb;max-width:40em}
.grades{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:14px}
.grades button{aspect-ratio:3/4;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:rgba(255,255,255,.93);color:#d0463b;box-shadow:0 5px 0 rgba(0,0,0,.2);transition:transform .2s}
.grades button b{font-family:Fredoka;font-weight:700;font-size:48px;line-height:1}
.grades button span{font-size:13px;font-weight:700;color:#1e2f5c}
.grades button:hover{transform:translateY(-3px)}
.grades button.on{background:var(--gold2);box-shadow:0 0 0 4px #fff,0 5px 0 rgba(0,0,0,.2);transform:translateY(-4px)}
.gsel{font-size:20px;color:#dfe7fb;margin:6px 0 0;min-height:28px}.gsel b{color:var(--gold2)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.go{height:62px;padding:0 34px;border-radius:18px;font-family:Fredoka;font-weight:600;font-size:23px;background:var(--gold2);color:#1e2f5c;box-shadow:0 5px 0 #b07d1c}
.go:disabled{opacity:.45;cursor:default}
.back{height:62px;padding:0 26px;border-radius:18px;font-family:Fredoka;font-weight:600;font-size:21px;background:rgba(255,255,255,.16);color:#fff;border:1.5px solid rgba(255,255,255,.35)}
.onbcard .stepper{margin-top:10px}
.onbcard .stepper button{background:#fff;color:#1e2f5c;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.onbcard .stepper .sv{display:flex;flex-direction:column;align-items:center}
.onbcard .stepper .num{font-size:100px}.onbcard .stepper .lab{font-size:21px;color:#dfe7fb}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.choice button{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);border-radius:20px;padding:16px 18px;text-align:left;color:#fff;display:flex;gap:14px;align-items:center}
.choice button b{font-family:Fredoka;font-weight:600;font-size:21px;display:block}
.choice button span span{font-size:15px;color:#dfe7fb}
.choice button.on{background:#fff;color:#1e2f5c;border-color:var(--gold2)}.choice button.on span span{color:var(--soft)}
.names textarea{height:170px}
.names .info{font-size:16px;color:#dfe7fb;margin-top:6px}
.ready{display:grid;grid-template-columns:1fr;gap:12px;margin-top:8px}
.ready div{background:rgba(255,255,255,.1);border-radius:20px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.ready b{font-family:Fredoka;font-weight:600;font-size:22px;color:var(--gold2)}
.ready span{font-size:17px;color:#e8eefc;line-height:1.35}
.ogear{position:absolute;right:46px;top:30px}
.ogear .tbtn{background:rgba(255,255,255,.16);backdrop-filter:blur(8px);color:#fff;border:1.5px solid rgba(255,255,255,.32)}
.ring{position:absolute;inset:-10px;border-radius:24px;border:4px solid var(--gold2);animation:ring 1.4s ease-out infinite;pointer-events:none}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.35);opacity:0}}
.pointer{position:absolute;right:118px;top:92px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
.pointer .bubble{background:var(--gold2);color:var(--ink);border-radius:18px;padding:14px 20px;font-size:19px;max-width:330px;box-shadow:0 6px 0 rgba(0,0,0,.25);animation:popin .5s cubic-bezier(.2,1.4,.4,1)}
.pointer svg{animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-10px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.kscroll{flex:1;min-height:0;overflow:auto}.kscroll .kgrid{overflow:visible}
.kh3{font-family:Fredoka,sans-serif;font-weight:600;font-size:20px;margin:26px 0 2px;color:inherit}
.sway2{animation:sway2 3.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}@keyframes sway2{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
</style>
</head>

<div id="stage">
  <div id="world"></div>

  <div id="ui"></div>
  <div id="fly"></div>
  <div id="onb"></div>
  <div id="ovl"></div>
  <div id="ovl2"></div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script src="app.js"></script>
