<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ljudtest – Julkalendern</title>
<meta name="robots" content="noindex">
<style>
body{margin:0;background:#FBF8F2;color:#1F2A24;font:18px/1.5 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:32px 20px}
h1{font-size:30px;margin:0 0 8px}
button{font:inherit;font-weight:600;padding:14px 22px;border-radius:14px;border:0;background:#2F6B4F;color:#fff;cursor:pointer;min-height:52px}
ul{list-style:none;padding:0;margin:20px 0}
li{background:#fff;border:1px solid #E8E1D3;border-radius:14px;padding:12px 16px;margin:8px 0}
.ok::before{content:"✓ ";color:#2F6B4F;font-weight:700}
.fel::before{content:"✗ ";color:#B8283A;font-weight:700}
.info::before{content:"• ";color:#6B4A00;font-weight:700}
</style>
</head>
<body>
<main>
  <h1>Ljudtest för Julkalendern</h1>
  <p>Sidan kontrollerar att uppläsningen kan spelas på den här datorn. Tryck på knappen och lyssna.</p>
  <button id="spela" type="button">Spela upp ett kort ljud</button>
  <ul id="lista"></ul>
  <p><a href="/julkalender/">Tillbaka till Julkalendern</a></p>
</main>
<script>
"use strict";
const lista = document.getElementById("lista");
const rad = (klass, text) => { const li = document.createElement("li"); li.className = klass; li.textContent = text; lista.appendChild(li); return li; };
const FEL = { 1: "avbröts", 2: "nätverksfel", 3: "kunde inte avkodas", 4: "filen hittades inte eller formatet stöds inte" };
const fil = "/julkalender/audio/ola/2-01.mp3?v=test";
const a = new Audio(); a.preload = "metadata";
a.addEventListener("loadedmetadata", () => rad("ok", `Ljudfilen hittades (${Math.round(a.duration)} sekunder lång).`));
a.addEventListener("error", () => rad("fel", `Ljudfilen kunde inte laddas: ${FEL[a.error && a.error.code] || "okänt fel"}.`));
a.src = fil;
rad("info", "Webbläsare: " + navigator.userAgent.replace(/^Mozilla\/5\.0 /, ""));
rad(a.canPlayType("audio/mpeg") ? "ok" : "fel", a.canPlayType("audio/mpeg") ? "Webbläsaren kan spela mp3." : "Webbläsaren säger att den inte kan spela mp3.");
function roster() {
  if (!("speechSynthesis" in window)) { rad("info", "Datorns egen talsyntes finns inte i den här webbläsaren."); return; }
  const v = speechSynthesis.getVoices();
  if (!v.length) return false;
  const sv = v.filter((x) => /^sv/i.test(x.lang));
  rad(sv.length ? "ok" : "info", sv.length ? "Svensk röst för talsyntes finns: " + sv.map((x) => x.name).join(", ") : "Ingen svensk röst för talsyntes finns på datorn (behövs bara för luckor du har ändrat texten i).");
  return true;
}
if (roster() === false && "speechSynthesis" in window) speechSynthesis.addEventListener("voiceschanged", roster, { once: true });
document.getElementById("spela").addEventListener("click", async () => {
  try {
    a.currentTime = 0; a.volume = 1; a.muted = false;
    await a.play();
    rad("ok", "Uppspelningen startade. Hörs ingenting nu är ljudet avstängt eller för lågt på datorn – eller så går det till fel högtalare/hörlurar.");
    setTimeout(() => { a.pause(); rad("info", `Spelade ${a.currentTime.toFixed(1)} sekunder och stoppade.`); }, 6000);
  } catch (e) {
    rad("fel", "Uppspelningen kunde inte starta: " + (e && e.name ? e.name : e) + ".");
  }
});
</script>
</body>
</html>
