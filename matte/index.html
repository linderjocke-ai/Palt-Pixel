<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Matteträning</title>
<script src="/assets/js/konfig.js"></script>
<script src="/assets/js/konto.js"></script>
<style>
:root{
  --paper:#fffdf6; --ink:#263238; --kid:#1c5fd1; --carry:#e8590c; --green:#2b9a57; --green-d:#1f7a44;
  --orange:#f08c00; --line:#d9e4ee; --card:#ffffff; --muted:#5f6f7a;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#paper,#ink{position:fixed;left:0;top:0}
#paper{z-index:1}
#ink{z-index:2;touch-action:none}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;border:none;background:none}

/* Top bar */
#top{position:fixed;z-index:10;left:0;right:0;top:0;padding:calc(8px + var(--sat)) calc(10px + var(--sar)) 8px calc(10px + var(--sal));display:flex;align-items:center;gap:8px;background:rgba(255,253,246,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
#top .menu{flex:none;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px}
#chips{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:999px;padding:8px 13px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:15px;white-space:nowrap}
.chip .sym{font-size:17px;margin-right:4px}
.chip.on{background:var(--kid);border-color:var(--kid);color:#fff}
.chip.prov{border-color:#f3c46b;background:#fff7e6}
.chip.prov.on{background:var(--orange);border-color:var(--orange);color:#fff}
#snd{flex:none;font-size:20px;background:#fff;border:2px solid var(--line);border-radius:12px;width:44px;height:40px}

/* Tools */
#tools{position:fixed;z-index:9;left:calc(8px + var(--sal));display:flex;flex-direction:column;gap:6px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 3px 10px rgba(0,0,0,.06)}
#tools button{width:44px;height:44px;border-radius:11px;font-size:20px;display:flex;align-items:center;justify-content:center}
#tools button.on{background:#e3edff;outline:2px solid var(--kid)}
#tools .lbl{font-size:9px;text-align:center;color:var(--muted);margin-top:-4px}

/* Panel */
#panel{position:fixed;z-index:8;background:var(--card);border-radius:20px;box-shadow:0 6px 24px rgba(30,50,80,.14);border:2px solid #e6edf3;padding:14px 16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;-webkit-overflow-scrolling:touch}
body.land #panel{right:calc(10px + var(--sar));width:360px;bottom:calc(10px + var(--sab))}
body.port #panel{left:calc(8px + var(--sal));right:calc(8px + var(--sar));bottom:calc(8px + var(--sab));height:min(47vh,430px)}
body.port.wide #panel.haskp{display:grid;grid-template-columns:1fr 250px;grid-auto-rows:min-content;column-gap:16px;align-content:start}
body.port.wide #panel .kp{grid-column:2;grid-row:1 / span 8}
#panel.hide{display:none}
.ptitle{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
.nr{background:var(--kid);color:#fff;border-radius:8px;padding:2px 8px;font-size:14px}
.nr.o{background:var(--orange)}
.sub{color:var(--muted);font-size:14px;margin-top:-6px}
.say{font-size:19px;line-height:1.4;background:#f4f8ff;border-radius:14px;padding:12px 14px;min-height:64px}
.say b{color:var(--kid)}
.say.done{background:#ecf9f0}
.ask{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:700;flex-wrap:wrap}
.box{min-width:84px;height:54px;border:3px solid var(--orange);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;padding:0 10px;font-family:"Chalkboard SE","Comic Sans MS","Comic Neue","Segoe Print",sans-serif;color:var(--kid);background:#fff8ec;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(240,140,0,.18)}}
.hintc{font-size:16px;color:#9a5a00;background:#fff4e0;border-radius:10px;padding:8px 10px}
.fb{font-size:17px;font-weight:700;min-height:22px}
.fb.ok{color:var(--green)}
.fb.bad{color:#c92a2a}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.kp button{height:54px;border-radius:13px;background:#f1f4f8;border:2px solid #dfe6ee;font-size:26px;font-weight:700}
.kp button:active{background:#dfe9ff}
.kp .ok{background:var(--green);border-color:var(--green-d);color:#fff;font-size:20px}
.kp .del{font-size:22px}
.kp.off{opacity:.35;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-height:48px;border-radius:13px;padding:10px 12px;font-weight:700;font-size:16px;background:#f1f4f8;border:2px solid #dfe6ee}
.btn.pri{background:var(--green);border-color:var(--green-d);color:#fff;font-size:18px}
.btn.blue{background:var(--kid);border-color:#164ea9;color:#fff}
.btn.org{background:var(--orange);border-color:#c87500;color:#fff}
.btn.sm{flex:none;min-height:42px;font-size:15px}
.prog{height:6px;border-radius:3px;background:#e6edf3;overflow:hidden}
.prog i{display:block;height:100%;background:var(--kid);transition:width .4s}
.task{font-size:17px}
.task b{font-size:24px;display:block;margin-top:2px;letter-spacing:.5px}
.ansbox{border:3px dashed var(--green);border-radius:16px;padding:10px 12px;background:#f2fbf5}
.anslbl{font-size:15px;font-weight:800;color:var(--green-d);margin-bottom:6px}
.ansrow{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:800;flex-wrap:wrap}
.af{min-width:96px;height:56px;border:3px solid #b9dcc6;border-radius:12px;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:"Chalkboard SE","Comic Sans MS","Comic Neue","Segoe Print",sans-serif;font-size:30px;color:var(--kid);padding:0 8px}
.af.sm{min-width:64px}
.af.on{border-color:var(--green);box-shadow:0 0 0 4px rgba(43,154,87,.18)}
.padrow{display:flex;align-items:center;gap:8px;margin:4px 0}
.padrow canvas{touch-action:none;display:block;flex:none}
.padclr{margin-left:auto;border:2px solid #dfe6ee;background:#fff;border-radius:10px;padding:6px 10px;font-size:14px;font-weight:700;color:var(--ink)}
.padclr small{font-size:10px;color:var(--muted)}
.restl{font-size:22px;font-weight:800}
.reads{font-size:16px;color:var(--muted);display:flex;align-items:center;gap:6px}
.reads b{color:var(--kid);font-size:22px;font-family:"Chalkboard SE","Comic Sans MS",sans-serif}
.modeb{background:none!important;border:none!important;color:var(--muted);text-decoration:underline;font-weight:600;padding:2px}
.unit{font-size:22px;font-weight:800;margin-left:8px;color:var(--ink)}
.task.geo{font-size:19px;line-height:1.4}
.task.geo b{display:inline;font-size:inherit;color:var(--kid)}
.chs .btn.ch{min-height:52px;font-size:18px}
.mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.grade{font-weight:700;color:var(--kid);font-size:15px}
.profs{display:flex;flex-direction:column;gap:10px}
.prof{display:flex;align-items:center;gap:14px;border:2px solid #e3eaf2;border-radius:18px;padding:16px;background:#fbfdff;text-align:left}
.prof .pi{font-size:40px}.prof .t{font-weight:800;font-size:20px}.prof .s{font-size:14px;color:var(--muted)}
.ekf .chip{padding:6px 12px;font-size:14px}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dots button{width:32px;height:32px;border-radius:50%;border:2px solid #cfd8e3;font-weight:700;font-size:13px;background:#fff}
.dots button.has{background:#dbe8ff;border-color:#9dbcf2}
.dots button.cur{outline:3px solid var(--orange)}

/* Overlays */
#ov{position:fixed;inset:0;z-index:20;background:rgba(255,253,246,.55);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:calc(12px + var(--sat)) 12px calc(12px + var(--sab))}
#ov.hide{display:none}
.card{background:#fff;border-radius:24px;box-shadow:0 10px 40px rgba(30,50,80,.2);border:2px solid #e6edf3;padding:20px;max-width:720px;width:100%;max-height:100%;overflow-y:auto}
.card h1{margin:0 0 4px;font-size:26px}
.card h2{margin:0 0 4px;font-size:22px}
.card p{margin:4px 0 14px;color:var(--muted);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tcard{border:2px solid #e3eaf2;border-radius:16px;padding:12px;text-align:left;background:#fbfdff;display:flex;flex-direction:column;gap:6px}
.tcard .t{font-weight:800;font-size:17px}
.tcard .e{font-family:"Chalkboard SE","Comic Sans MS",sans-serif;color:var(--kid);font-size:18px}
.tcard .s{font-size:13px;color:var(--muted)}
.tcard .r{display:flex;gap:6px;margin-top:4px}
.tcard .r button{flex:1;border-radius:10px;padding:8px;font-weight:700;font-size:14px}
.tcard .g{background:var(--kid);color:#fff}
.tcard .o{background:#eef2f6}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sumbox{border-radius:16px;padding:12px 14px;margin:10px 0;border:2px solid #e3eaf2;background:#fbfdff}
.sumbox h3{margin:0 0 6px;font-size:17px}.sumbox p{margin:4px 0;font-size:16px;line-height:1.4}
.nextbox{border:2px solid #9ec5fe;background:#eef5ff}
.lv{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800;white-space:nowrap}
.lv.good{background:#d3f9d8;color:#2b8a3e}.lv.mid{background:#fff3bf;color:#a86b00}.lv.weak{background:#ffe3e3;color:#c92a2a}.lv.few{background:#e7f5ff;color:#1864ab}.lv.none{background:#f1f3f5;color:#868e96}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:10px}
.rcard{border:2px solid #e3eaf2;border-radius:16px;padding:12px;background:#fbfdff;display:flex;flex-direction:column;gap:6px;text-align:left}
.rcard.weak{border-color:#ffc9c9}.rcard.good{border-color:#b2f2bb}
.rbar{height:10px;border-radius:6px;background:#edf2f7;overflow:hidden}.rbar i{display:block;height:100%;border-radius:6px}
.rmeta{font-size:13px;color:#607080}
.subs{display:flex;flex-wrap:wrap;gap:5px}.subs button,.subs span{font-size:13px;border-radius:999px;padding:3px 9px;border:1.5px solid #dee2e6;background:#fff}
.subs .w{border-color:#ffa8a8;background:#fff5f5;color:#c92a2a;font-weight:700}.subs .g{border-color:#b2f2bb;color:#2b8a3e}
.rbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}.rbtns button{flex:1;white-space:nowrap;padding:0 8px;min-height:40px;border-radius:12px;font-weight:700;font-size:14px;border:2px solid #d0dbe7;background:#fff}
.rbtns .p{background:#1c5fd1;color:#fff;border-color:#1c5fd1}
.tests{display:flex;flex-direction:column;gap:4px;font-size:15px}
.subtag{display:inline-flex;align-items:center;gap:6px;background:#fff3bf;border-radius:999px;padding:3px 10px;font-size:14px;font-weight:700;margin:4px 0}
.subtag button{border:none;background:none;font-size:15px;padding:0 2px}
.provcard{margin-top:12px;border:2px solid #f3c46b;background:#fff7e6;border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.provcard .big{font-size:34px}
.provcard .t{font-weight:800;font-size:18px}
.provcard .s{font-size:14px;color:var(--muted)}
.res{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.res button{display:flex;align-items:center;gap:10px;border:2px solid #e3eaf2;border-radius:12px;padding:10px 12px;text-align:left;background:#fbfdff;font-size:16px}
.res .mk{font-size:22px;width:28px}
.res .q{flex:1;font-weight:700}
.res .a{color:var(--muted);font-size:14px}
.score{font-size:44px;font-weight:900;color:var(--green)}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.kontorad{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 10px;margin-top:14px;font-size:13.5px;color:var(--muted)}
.kontorad:empty{display:none}
.kbtn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:700;color:var(--ink);cursor:pointer}
.klank{background:none;border:0;padding:0;font:inherit;color:var(--kid);text-decoration:underline;cursor:pointer}
</style>
</head>

<script>
"use strict";
/* ================= Basics ================= */
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const dig=n=>String(n).split('').reverse().map(Number);           // [ental, tiotal, ...]
const SING=['ental','tiotal','hundratal','tusental','tiotusental'];
const NAMEP=['entalen','tiotalen','hundratalen','tusentalen','tiotusentalen'];
const LAB=['E','T','H','Tu','TT'];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};

const TOPICS_4=[
 {id:'add', nr:'2.1', name:'Addition med uppställning', chip:'Addition', sym:'+', ex:'367 + 258'},
 {id:'sub', nr:'2.2', name:'Subtraktion med uppställning', chip:'Subtraktion', sym:'−', ex:'532 − 174'},
 {id:'mul', nr:'2.3', name:'Multiplikation med uppställning', chip:'Multiplikation', sym:'·', ex:'247 · 3'},
 {id:'div', nr:'2.4', name:'Kort division', chip:'Kort division', sym:'/', ex:'846 / 2'},
 {id:'rest',nr:'2.5', name:'Division med rest', chip:'Med rest', sym:'/', ex:'847 / 4'},
 {id:'mem', nr:'2.6', name:'Division med minnessiffra', chip:'Minnessiffra', sym:'/', ex:'732 / 3'},
];
const TOPICS_7=[
 {id:'vinkel', nr:'3.1', name:'Vinklar', chip:'Vinklar', sym:'∠', ex:'Sidovinklar, vertikalvinklar'},
 {id:'mang', nr:'3.2', name:'Månghörningar', chip:'Månghörningar', sym:'⬠', ex:'Trianglar och fyrhörningar'},
 {id:'vsum', nr:'3.3', name:'Månghörningar och vinkelsumma', chip:'Vinkelsumma', sym:'180°', ex:'Triangel, fyrhörning, sexhörning'},
 {id:'enh', nr:'3.4', name:'Enheter och prefix', chip:'Enheter', sym:'cm', ex:'Längd, mil, vikt och volym'},
 {id:'omkrets', nr:'3.5', name:'Omkrets', chip:'Omkrets', sym:'O', ex:'Rektangel, månghörning, cirkel'},
 {id:'arearp', nr:'3.6', name:'Area av rektanglar och parallellogrammer', chip:'Area ▭', sym:'A', ex:'A = b · h'},
 {id:'areatri', nr:'3.7', name:'Area av trianglar', chip:'Area △', sym:'A', ex:'A = b · h / 2'},
 {id:'areacirk', nr:'3.8', name:'Area av cirklar', chip:'Area ○', sym:'A', ex:'A = π · r · r'},
];
const CHAPTERS={
  ak4k2:{grade:'Årskurs 4',book:'Alfa',title:'Kapitel 2 – De fyra räknesätten',topics:TOPICS_4,
    intro:'Först kommer en genomgång där du får göra varje steg själv. Sedan kan du öva eller göra träningsprovet.'},
  ak7k3:{grade:'Årskurs 7',book:'Prio Matematik 7',title:'Kapitel 3 – Geometri',topics:TOPICS_7,
    intro:'Varje avsnitt börjar med en genomgång där du räknar varje steg själv. Rita och räkna gärna på rutpappret.'}
};
const PROFILES=[{id:'ak4',name:'Årskurs 4',icon:'🧮',chapters:['ak4k2']},{id:'ak7',name:'Årskurs 7',icon:'📐',chapters:['ak7k3']}];
let TOPICS=TOPICS_4;
const ALLT=[...TOPICS_4,...TOPICS_7];
const T=id=>ALLT.find(t=>t.id===id);
const OPS={add:'+',sub:'−',mul:'·',div:'/',rest:'/',mem:'/'};
const isGeo=p=>!!(p&&typeof GEO!=='undefined'&&GEO[p.type]);
const ptext=p=>isGeo(p)?GEO[p.type].short(p):`${p.a} ${OPS[p.type]} ${p.b}`;
function answer(p){
  if(isGeo(p)) return GEO[p.type].answer(p);
  if(p.type==='add') return {q:p.a+p.b,r:0};
  if(p.type==='sub') return {q:p.a-p.b,r:0};
  if(p.type==='mul') return {q:p.a*p.b,r:0};
  return {q:Math.floor(p.a/p.b), r:p.a%p.b};
}
const ansKind=p=>p.type==='rest'?'rest':isGeo(p)&&GEO[p.type].choices&&GEO[p.type].choices(p)?'choice':'num';
const unitOf=p=>isGeo(p)?GEO[p.type].unit(p):'';
const allowDec=p=>isGeo(p);
function normA(p,x){if(x==null||x==='')return '';if(ansKind(p)==='choice')return String(x);const v=parseFloat(String(x).replace(',','.'));return isNaN(v)?'#':String(+v.toFixed(6)).replace('.',',')}
function isRight(p,A){const a=answer(p);if(isGeo(p)&&GEO[p.type].check&&A.q!==''){const c=GEO[p.type].check(p,parseFloat(String(A.q).replace(',','.')));if(c!==null)return c}if(ansKind(p)==='rest')return A.q!==''&&Number(A.q)===a.q&&A.r!==''&&Number(A.r)===a.r;return A.q!==''&&normA(p,A.q)===normA(p,a.q)}
function fmtA(p,x){if(x.q==='')return '–';const u=unitOf(p);return ansKind(p)==='rest'?`${x.q} rest ${x.r===''?'–':x.r}`:`${String(x.q).replace('.',',')}${u?(u==='°'?'°':' '+u):''}`}
function taskHTML(p){return isGeo(p)?`<div class="task geo">${GEO[p.type].q(p)}</div>`:`<div class="task">Räkna med uppställning på rutpappret:<b>${ptext(p)}</b></div>`}

/* ================= Store ================= */
const store={get(){try{return JSON.parse(localStorage.getItem('kap2stars')||'{}')}catch(e){return {}}},
  add(id){try{const s=this.get();s[id]=(s[id]||0)+1;localStorage.setItem('kap2stars',JSON.stringify(s))}catch(e){}}};

/* ================= Resultatlogg (sparas lokalt + synkas mellan enheter när det går) ================= */
const LOG={
  dev:(()=>{try{let d=localStorage.getItem('mx-dev');if(!d){d=Math.random().toString(36).slice(2,8);localStorage.setItem('mx-dev',d)}return d}catch(_){return 'x'}})(),
  data:(()=>{try{return JSON.parse(localStorage.getItem('mx-log')||'{}')}catch(_){return {}}})(),
  db:null,sync:'local',dirty:new Set(),timer:null,chain:Promise.resolve(),
  events(pid){return this.data[pid]||[]},
  save(){try{localStorage.setItem('mx-log',JSON.stringify(this.data))}catch(_){}},
  day(t){const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},
  add(e){const pid=S.profile;if(!pid)return;e.t=Date.now();e.d=this.dev;e.i=this.dev+e.t.toString(36)+Math.random().toString(36).slice(2,5);
    (this.data[pid]=this.data[pid]||[]).push(e);if(this.data[pid].length>4000)this.data[pid]=this.data[pid].slice(-4000);this.save();
    this.dirty.add(pid+'|'+this.day(e.t));clearTimeout(this.timer);this.timer=setTimeout(()=>this.push(),1500)},
  push(){if(!this.db)return;const keys=[...this.dirty];this.dirty.clear();
    for(const k of keys){const [pid,day]=k.split('|');const ev=this.events(pid).filter(e=>e.d===this.dev&&this.day(e.t)===day);
      this.chain=this.chain.then(()=>this.db.collection('logs').doc(pid+'_'+this.dev+'_'+day).set({profile:pid,dev:this.dev,day,ev})).catch(err=>{if(err&&err.code==='unavailable')this.dirty.add(k)})}},
  merge(pid,list){const have=new Set(this.events(pid).map(e=>e.i));let n=0;
    for(const e of list)if(e&&e.i&&!have.has(e.i)){(this.data[pid]=this.data[pid]||[]).push(e);have.add(e.i);n++}
    if(n){this.data[pid].sort((a,b)=>a.t-b.t);this.save()}return n},
  async pull(pid){if(!this.db)return 0;let n=0;
    try{const snap=await Promise.race([this.db.collection('logs').where('profile','==',pid).get(),new Promise((_,r)=>setTimeout(()=>r('timeout'),10000))]);
      snap.docs.forEach(d=>{const x=d.data();if(x&&Array.isArray(x.ev))n+=this.merge(pid,x.ev)})}catch(_){}

    if(window.claude&&claude.use){db=await claude.use('db');if(db)this.sync='cloud'}

    if(!db)return;this.db=db;

    for(const pid in this.data)for(const e of this.data[pid])if(e.d===this.dev)this.dirty.add(pid+'|'+this.day(e.t));this.push();
    let n=0;for(const p of PROFILES)n+=await this.pull(p.id);if(S.mode==='results')showResults(S.resPid);else if(n&&S.mode==='menu')showMenu()}catch(_){}}
};

function subOf(p){
  switch(p.type){
    case 'add':return p.a>=1000?'fyrsiffriga tal':'tresiffriga tal';
    case 'sub':return String(p.a).slice(0,-1).includes('0')?'växling vid nolla':'vanlig växling';
    case 'mul':return p.a>=100?'tresiffrigt tal':'tvåsiffrigt tal';
    case 'vinkel':return {typ:'vinkeltyper',sido:'sidovinklar',vert:'vertikalvinklar'}[p.m];
    case 'vsum':return {tri:'triangel',likbent:'likbent triangel',fyr:'fyrhörning',poly:'månghörning'}[p.m];
    case 'mang':return {namn:'namn efter hörn',tri:'sorters trianglar',fyr:'sorters fyrhörningar'}[p.m];
    case 'enh':return ladderOf(p.from);
    case 'omkrets':return {rekt:'rektangel',poly:'månghörning',cirkel:'cirkel'}[p.m];
    case 'arearp':case 'area':return {rekt:'rektangel',para:'parallellogram',tri:'triangel'}[p.m];
    case 'areacirk':return p.r?'med radien':'med diametern';
  }return ''}

function genAdd(){for(;;){const a=Math.random()<.25?R(1000,4999):R(120,899), b=R(120,899);
  const A=dig(a),B=dig(b);let c=0,carries=0;for(let i=0;i<Math.max(A.length,B.length);i++){const s=(A[i]||0)+(B[i]||0)+c;c=s>=10?1:0;carries+=c}
  if(carries>=1) return {type:'add',a,b};}}
function genSub(){for(;;){let a=R(300,999); if(Math.random()<.3) a=Math.floor(a/100)*100+R(0,9);
  const b=R(100,a-100); if(a-b<100) continue; const A=dig(a),B=dig(b);
  if(A.some((d,i)=>B[i]!=null&&d<B[i])) return {type:'sub',a,b};}}
function genMul(){for(;;){const a=Math.random()<.5?R(12,98):R(102,489), m=R(3,9);
  if(a%10===0) continue; if(dig(a).some(d=>d*m>=10)) return {type:'mul',a,b:m};}}
function genDiv(){const d=R(2,4), n=Math.random()<.35?2:3, mx=Math.floor(9/d);let s='';
  for(let i=0;i<n;i++){const q=i===0?R(1,mx):R(0,mx);s+=q*d} return {type:'div',a:+s,b:d};}
function genRest(){const d=R(2,5), n=Math.random()<.35?2:3, mx=Math.floor(9/d);let s='';
  for(let i=0;i<n-1;i++){const q=i===0?R(1,mx):R(0,mx);s+=q*d}
  const ql=R(0,Math.floor(8/d)), r=R(1,Math.min(d-1,9-ql*d)); s+=ql*d+r; return {type:'rest',a:+s,b:d};}

function setupColumns(bd,p,W,col,sign){
  const A=dig(p.a),B=dig(p.b),n=Math.max(A.length,B.length);
  return [
    ()=>{for(let q=0;q<n;q++) put(bd,col(q),0,LAB[q],'label')},
    ...A.map((d,q)=>[q,d]).reverse().map(([q,d])=>()=>put(bd,col(q),2,d)),
    ...B.map((d,q)=>[q,d]).reverse().map(([q,d])=>()=>put(bd,col(q),3,d)),
    ()=>put(bd,0,3,sign,'sign'),
    ()=>hline(bd,3,0,W,'bottom')

}
function lessonAdd(p){

  return {board:bd,steps:st};

function makeLesson(p){if(isGeo(p))return GEO[p.type].lesson(p);return p.type==='add'?lessonAdd(p):p.type==='sub'?lessonSub(p):p.type==='mul'?lessonMul(p):lessonDiv(p)}
function bareBoard(p){

  const L=makeLesson(p);(L.steps[1].acts||[]).forEach(f=>f());

/* ===== Sifferigenkänning: litet faltningsnät tränat på 70 000 handskrivna siffror ===== */
const NET=(()=>{
  let W=null;
  function f16(h){const s=(h&0x8000)?-1:1,e=(h>>10)&31,m=h&1023;
    if(e===0)return s*Math.pow(2,-14)*(m/1024);if(e===31)return m?NaN:s*Infinity;return s*Math.pow(2,e-15)*(1+m/1024)}
  function load(){
    if(W)return W;
    const bin=atob(WEIGHTS_B64),n=bin.length/2,all=new Float32Array(n);
    for(let i=0;i<n;i++)all[i]=f16(bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8));
    const shapes=[[3,3,1,16],[16],[3,3,16,32],[32],[3,3,32,64],[64],[576,64],[64],[64,10],[10]];
    let o=0;W=shapes.map(s=>{const len=s.reduce((a,b)=>a*b,1);const a=all.subarray(o,o+len);o+=len;return a});
    return W;
  }
  // x: Float32Array H*W*C (HWC)
  function conv(x,H,Wd,C,k,b,O){const y=new Float32Array(H*Wd*O);
    for(let i=0;i<H;i++)for(let j=0;j<Wd;j++){const yo=(i*Wd+j)*O;for(let o=0;o<O;o++)y[yo+o]=b[o];
      for(let di=0;di<3;di++){const ii=i+di-1;if(ii<0||ii>=H)continue;
        for(let dj=0;dj<3;dj++){const jj=j+dj-1;if(jj<0||jj>=Wd)continue;const xo=(ii*Wd+jj)*C,ko=(di*3+dj)*C*O;
          for(let c=0;c<C;c++){const v=x[xo+c];if(v===0)continue;const kc=ko+c*O;for(let o=0;o<O;o++)y[yo+o]+=v*k[kc+o]}}}
      for(let o=0;o<O;o++)if(y[yo+o]<0)y[yo+o]=0}
    return y}
  function pool(x,H,Wd,C){const h=H>>1,w=Wd>>1,y=new Float32Array(h*w*C);
    for(let i=0;i<h;i++)for(let j=0;j<w;j++)for(let c=0;c<C;c++){let m=-1e9;
      for(let a=0;a<2;a++)for(let b=0;b<2;b++){const v=x[((2*i+a)*Wd+2*j+b)*C+c];if(v>m)m=v}y[(i*w+j)*C+c]=m}
    return y}
  function dense(x,k,b,O,relu){const I=x.length,y=new Float32Array(O);for(let o=0;o<O;o++)y[o]=b[o];
    for(let i=0;i<I;i++){const v=x[i];if(v===0)continue;const ko=i*O;for(let o=0;o<O;o++)y[o]+=v*k[ko+o]}
    if(relu)for(let o=0;o<O;o++)if(y[o]<0)y[o]=0;return y}
  function forward(img){ // img: Float32Array 784, 0..1
    const w=load();
    let x=conv(img,28,28,1,w[0],w[1],16);x=pool(x,28,28,16);
    x=conv(x,14,14,16,w[2],w[3],32);x=pool(x,14,14,32);
    x=conv(x,7,7,32,w[4],w[5],64);x=pool(x,7,7,64);
    x=dense(x,w[6],w[7],64,true);return dense(x,w[8],w[9],10,false);
  }
  // strokes: [[ [x,y], ... ], ...] i valfria enheter
  function render(strokes){
    const pts=strokes.flat();let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
    for(const p of pts){x1=Math.min(x1,p[0]);y1=Math.min(y1,p[1]);x2=Math.max(x2,p[0]);y2=Math.max(y2,p[1])}
    const w=x2-x1,h=y2-y1,m=Math.max(w,h),s=m>1e-6?20/m:1,ox=(28-w*s)/2,oy=(28-h*s)/2,S=4,LW=2.8;
    const cv=document.createElement('canvas');cv.width=cv.height=28*S;const c=cv.getContext('2d');
    c.fillStyle='#000';c.fillRect(0,0,28*S,28*S);c.strokeStyle='#fff';c.fillStyle='#fff';c.lineWidth=LW*S;c.lineCap='round';c.lineJoin='round';
    for(const st of strokes){const q=st.map(p=>[(p[0]-x1)*s*S+ox*S,(p[1]-y1)*s*S+oy*S]);
      c.beginPath();c.moveTo(q[0][0],q[0][1]);for(const p of q.slice(1))c.lineTo(p[0],p[1]);if(q.length===1)c.lineTo(q[0][0]+.01,q[0][1]);c.stroke()}
    const d=c.getImageData(0,0,28*S,28*S).data,a=new Float32Array(784);
    for(let y=0;y<28*S;y++)for(let x=0;x<28*S;x++)a[((y/S)|0)*28+((x/S)|0)]+=d[(y*28*S+x)*4]/255/(S*S);
    return center(a);
  }
  function center(a){let t=0,cx=0,cy=0;for(let y=0;y<28;y++)for(let x=0;x<28;x++){const v=a[y*28+x];t+=v;cx+=v*x;cy+=v*y}
    if(t<=0)return a;const dy=Math.round(13.5-cy/t),dx=Math.round(13.5-cx/t),b=new Float32Array(784);
    for(let y=0;y<28;y++)for(let x=0;x<28;x++){const sy=y-dy,sx=x-dx;if(sy>=0&&sy<28&&sx>=0&&sx<28)b[y*28+x]=a[sy*28+sx]}
    return b}
  function recognize(strokes){
    strokes=strokes.filter(s=>s.length);if(!strokes.length)return null;
    const lg=forward(render(strokes));const mx=Math.max(...lg);const ex=Array.from(lg,v=>Math.exp(v-mx));const sum=ex.reduce((a,b)=>a+b,0);
    const pr=ex.map(v=>v/sum);const r=pr.map((p,i)=>i).sort((a,b)=>pr[b]-pr[a]);
    return {d:String(r[0]),alt:String(r[1]),p:pr[r[0]],p2:pr[r[1]]};
  }
  return {recognize,forward,render};
})();

const fmt=x=>String(+(+x).toFixed(6)).replace('.',',');
const num=s=>parseFloat(String(s).replace(',','.'));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const pick=a=>a[R(0,a.length-1)];
const D2R=Math.PI/180;
const dirv=deg=>[Math.cos(deg*D2R),-Math.sin(deg*D2R)];           // y nedåt
const angOf=(P,Q)=>Math.atan2(-(Q[1]-P[1]),Q[0]-P[0])/D2R;
let SHID=0;
function shp(b,o){const now=performance.now();o.id=o.id||('s'+(++SHID));o.born=now;b.shapes.push(o);touch();
  if(o.dur)dirtyUntil=Math.max(dirtyUntil,now+o.dur+300);if(o.life){o.dieAt=now+o.life;dirtyUntil=Math.max(dirtyUntil,o.dieAt+600)}return o.id}
// ---- markering (highlight) av delar i genomgångar ----
function reg(b,name,ids){b.P[name]=[].concat(b.P[name]||[],ids);return ids}
function N(b,...ns){return ns.flat().flatMap(n=>n==null?[]:String(n).startsWith('s')&&!b.P[n]?[n]:[].concat(b.P[n]||[]))}
function hl(b,...ns){b.hs=N(b,...ns);touch()}
function kill(b,...ns){const now=performance.now();N(b,...ns).forEach(id=>{const sh=b.shapes.find(x=>x.id===id);if(sh&&!sh.dieAt)sh.dieAt=now});dirtyUntil=Math.max(dirtyUntil,now+700);kick()}
function setT(b,name,t,o){N(b,name).forEach(id=>{const sh=b.shapes.find(x=>x.id===id);if(sh&&sh.k==='txt'){sh.t=t;sh.born=performance.now();Object.assign(sh,o||{})}});touch()}
function ghostSides(b,pts,name){pts.forEach((A,i)=>reg(b,name+i,seg(b,A,pts[(i+1)%pts.length],{w:3,ghost:true})))}
function prot(b,c,a0,sweep,o){return shp(b,{k:'prot',c,a0,sweep,r:(o&&o.r)||2.6,dur:(o&&o.dur)||2200,...(o||{})})}
function wedge(b,c,a0,a1,color,o){return shp(b,{k:'wedge',c,r:(o&&o.r)||.9,a0,a1,color,dur:(o&&o.dur)||700,...(o||{})})}
function trace(b,o){return shp(b,{k:'trace',dur:2200,life:3400,...o})}
function seg(b,a,c,o){return shp(b,{k:'seg',a,b:c,...(o||{})})}
function poly(b,pts,o){return shp(b,{k:'poly',pts,...(o||{})})}
function txt(b,p,t,o){return shp(b,{k:'txt',p,t,...(o||{})})}
function angMark(b,P,Q1,Q2,label,o){
  o=o||{};let a1=angOf(P,Q1),a2=angOf(P,Q2),d=((a2-a1)%360+360)%360,s=a1;
  if(d>180){s=a2;d=360-d}
  const r=o.r||.9,ids=[];
  if(o.right) ids.push(shp(b,{k:'right',c:P,a0:s,color:o.color}));
  else ids.push(shp(b,{k:'arc',c:P,r,a0:s,a1:s+d,color:o.color,hlKeep:o.hlKeep}));
  if(label){const m=s+d/2,dv=dirv(m),rr=r+(o.lr||.55);ids.push(txt(b,[P[0]+dv[0]*rr,P[1]+dv[1]*rr],label,{color:o.lcolor||o.color,size:o.size||.46}))}
  return ids;
}
function sideLabel(b,A,B,t,o){ // text utanför sidan AB (åt vänster om riktningen A->B, eller höger med o.in)
  o=o||{};const mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2,dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy)||1;
  let nx=dy/L,ny=-dx/L;if(o.flip){nx=-nx;ny=-ny}const k=o.off||.45;
  return txt(b,[mx+nx*k,my+ny*k],t,{size:o.size||.42,color:o.color||'#37474f'});

      m=angMark(b,A,B,C,`${p.a}°`,{r:.8});reg(b,'A',m[0]);reg(b,'Al',m[1]);m=angMark(b,B,C,A,`${p.b}°`,{r:.8});reg(b,'B',m[0]);reg(b,'Bl',m[1]);
      m=angMark(b,C,A,B,'v',{r:.7,color:VCOL,size:.5});reg(b,'V',m[0]);reg(b,'Vl',m[1]);}
    else if(p.m==='likbent'){const bv=(180-p.t)/2,[A,B,C]=triPts(bv,bv);b.G={A,B,C};reg(b,'fig',poly(b,[A,B,C],{w:3,fill:F}));
      m=angMark(b,C,A,B,`${p.t}°`,{r:.7});reg(b,'T',m[0]);reg(b,'Tl',m[1]);
      m=angMark(b,A,B,C,'v',{r:.8,color:VCOL,size:.5});reg(b,'V',m[0]);reg(b,'Vl',m[1]);m=angMark(b,B,C,A,'v',{r:.8,color:VCOL,size:.5});reg(b,'V',m[0]);reg(b,'Vl',m[1]);
      reg(b,'legs',seg(b,A,C,{w:3,ghost:true}));reg(b,'legs',seg(b,B,C,{w:3,ghost:true}));
      for(const [P,Q] of [[A,C],[B,C]]){const mm=[(P[0]+Q[0])/2,(P[1]+Q[1])/2],dx=Q[0]-P[0],dy=Q[1]-P[1],L=Math.hypot(dx,dy),n=[-dy/L*.22,dx/L*.22];reg(b,'ticks',seg(b,[mm[0]-n[0],mm[1]-n[1]],[mm[0]+n[0],mm[1]+n[1]],{w:2.5}))}}
    else{const A=[1.5,6.5],B=[9.5,6.5],C=[8.3,1.8],D=[2.8,2.6];b.G={A,B,C,D};reg(b,'fig',poly(b,[A,B,C,D],{w:3,fill:F}));
      m=angMark(b,A,B,D,`${p.a}°`,{r:.8});reg(b,'A',m[0]);reg(b,'Al',m[1]);m=angMark(b,B,C,A,`${p.b}°`,{r:.8});reg(b,'B',m[0]);reg(b,'Bl',m[1]);
      m=angMark(b,C,D,B,`${p.c}°`,{r:.7});reg(b,'C',m[0]);reg(b,'Cl',m[1]);m=angMark(b,D,A,C,'v',{r:.7,color:VCOL,size:.5});reg(b,'V',m[0]);reg(b,'Vl',m[1]);
      txt(b,[5.5,7.5],'Figuren är inte skalenlig.',{size:.3,color:'#90a4ae'});}
  },
  board(p){const b=newBoard(12,8);vsum.fig(b,p);return b},
  lesson(p){
    const b=newBoard(12,8),st=[],ans=vsum.answer(p).q,fig=()=>vsum.fig(b,p);
    if(p.m==='poly'){const t=p.n-2,TC=['rgba(28,126,214,.22)','rgba(47,158,68,.22)'];
      const tris=()=>{const P=b.G.P;for(let i=1;i<p.n-1;i++){reg(b,'tri'+i,poly(b,[P[0],P[i],P[i+1]],{ghost:true,noStroke:true,hfill:TC[i%2]}));reg(b,'tris',b.P['tri'+i])}};
      const cen=i=>{const P=b.G.P;return [(P[0][0]+P[i][0]+P[i+1][0])/3,(P[0][1]+P[i][1]+P[i+1][1])/3]};
      st.push({say:`Det här är en ${PNAMN[p.n]}. Vi ska räkna ut dess vinkelsumma, alltså alla vinklarna tillsammans.`,acts:[fig,tris,()=>hl(b,'fig')]});
      st.push({say:'Dra linjer från ett hörn till alla andra hörn. Då delas månghörningen upp i trianglar.',hs:[],
        acts:[()=>{const P=b.G.P;reg(b,'v0',shp(b,{k:'dot',c:P[0],color:VCOL}));hl(b,'v0')},()=>{const P=b.G.P;for(let i=2;i<p.n-1;i++)reg(b,'diag',seg(b,P[0],P[i],{w:2,dash:true,color:VCOL}));hl(b,'v0','diag')}]});
      st.push({say:'Det blir alltid två trianglar färre än antalet hörn. Hur många trianglar blir det?',hsN:['tris','diag'],input:{type:'ask',prompt:`${p.n} − 2 =`,val:String(t)},
        after:()=>{for(let i=1;i<p.n-1;i++)reg(b,'tn',txt(b,cen(i),String(i),{size:.5,color:'#263238',bold:true}))}});
      st.push({say:`Varje triangel har vinkelsumman 180°. Räkna ${t} · 180.`,pre:()=>kill(b,'tn'),hsN:['tris'],
        acts:[()=>{for(let i=1;i<p.n-1;i++)reg(b,'t180',txt(b,cen(i),'180°',{size:.34,color:'#263238',bold:true}))}],input:{type:'ask',prompt:`${t} · 180 =`,val:ans}});
      st.push({say:`Klart! Vinkelsumman i en ${PNAMN[p.n]} är **${ans}°**.`,hsN:['fig']});
    }else if(p.m==='tri'){const s=p.a+p.b;
      st.push({say:'Vi ska räkna ut vinkeln v i triangeln.',acts:[fig,()=>{paint(b,['A','Al'],CA);paint(b,['B','Bl'],CB);paint(b,['V','Vl'],VCOL);hl(b,'V','Vl')}]});
      st.push({say:'I en triangel är vinkelsumman alltid **180°**. Alla tre vinklarna blir tillsammans 180°.',hsN:['A','B','V'],
        acts:tearDemo(b,[{color:CA,label:`${p.a}°`,hl:['A']},{color:VCOL,label:'',hl:['V']},{color:CB,label:`${p.b}°`,hl:['B']}])});
      st.push({say:`Lägg först ihop vinklarna du vet: ${p.a} + ${p.b}.`,pre:()=>kill(b,'par','wedge','wl'),hsN:['A','Al','B','Bl'],input:{type:'ask',prompt:`${p.a} + ${p.b} =`,val:String(s)}});
      st.push({say:`Det som saknas upp till 180° är v. Räkna 180 − ${s}.`,hsN:['V','Vl'],input:{type:'ask',prompt:`180 − ${s} =`,val:ans}});
      st.push({say:`Klart! **v = ${ans}°**`,acts:[()=>{setT(b,'Vl',`${ans}°`);hl(b,'V','Vl')}]});
    }else if(p.m==='likbent'){const r=180-p.t;
      st.push({say:'Triangeln är **likbent**. Två sidor är lika långa. Då är också de två basvinklarna lika stora.',acts:[fig,()=>{paint(b,['T','Tl'],CA);hl(b,'legs','ticks')},()=>hl(b,'legs','ticks','V','Vl')]});
      st.push({say:'Vinkelsumman i en triangel är 180°.',hsN:['T','V'],acts:tearDemo(b,[{color:VCOL,label:'v',hl:['V']},{color:CA,label:'',hl:['T']},{color:VCOL,label:'v',hl:[]}])});
      st.push({say:`Ta bort toppvinkeln från 180°. Räkna 180 − ${p.t}.`,pre:()=>kill(b,'par','wedge','wl'),hsN:['T','Tl'],input:{type:'ask',prompt:`180 − ${p.t} =`,val:String(r)}});
      st.push({say:`De två basvinklarna delar lika på ${r}°. Räkna ${r} / 2.`,hsN:['V','Vl'],input:{type:'ask',prompt:`${r} / 2 =`,val:ans}});
      st.push({say:`Klart! Varje basvinkel är **${ans}°**.`,acts:[()=>{setT(b,'Vl',`${ans}°`);hl(b,'V','Vl')}]});
    }else{const s=p.a+p.b+p.c;
      st.push({say:'Det här är en fyrhörning. Vi ska räkna ut vinkeln v.',acts:[fig,()=>hl(b,'V','Vl')]});
      st.push({say:'I en fyrhörning är vinkelsumman alltid **360°**.',hs:[],
        acts:[()=>{const {A,B,C,D}=b.G;reg(b,'diag',seg(b,B,D,{w:2.2,dash:true,color:VCOL}));
            reg(b,'t1',poly(b,[A,B,D],{ghost:true,noStroke:true,hfill:'rgba(28,126,214,.22)'}));reg(b,'t2',poly(b,[B,C,D],{ghost:true,noStroke:true,hfill:'rgba(47,158,68,.22)'}));hl(b,'diag')},
          ()=>{const {A,B,D}=b.G;reg(b,'t180',txt(b,[(A[0]+B[0]+D[0])/3,(A[1]+B[1]+D[1])/3],'180°',{size:.42,color:CA,bold:true}));hl(b,'diag','t1')},
          ()=>{const {B,C,D}=b.G;reg(b,'t180',txt(b,[(B[0]+C[0]+D[0])/3,(B[1]+C[1]+D[1])/3],'180°',{size:.42,color:CB,bold:true}));hl(b,'diag','t1','t2')},
          ()=>{reg(b,'t180',txt(b,[5.5,.75],'180° + 180° = 360°',{size:.45,color:VCOL,bold:true}))}]});
      st.push({say:`Lägg ihop vinklarna du vet: ${p.a} + ${p.b} + ${p.c}.`,pre:()=>kill(b,'t180','diag'),hsN:['A','Al','B','Bl','C','Cl'],input:{type:'ask',prompt:`${p.a} + ${p.b} + ${p.c} =`,val:String(s)}});
      st.push({say:`Räkna 360 − ${s}.`,hsN:['V','Vl'],input:{type:'ask',prompt:`360 − ${s} =`,val:ans}});
      st.push({say:`Klart! **v = ${ans}°**`,acts:[()=>{setT(b,'Vl',`${ans}°`);hl(b,'V','Vl')}]});
    }
    return {board:b,steps:st};
  },
  gen(){const r=Math.random();
    if(r<.2)return {type:'vsum',m:'poly',n:R(5,8)};
    if(r<.5){let a,bb;do{a=R(6,16)*5;bb=R(6,17)*5}while(a+bb>150);return {type:'vsum',m:'tri',a,b:bb}}
    if(r<.75)return {type:'vsum',m:'likbent',t:R(2,12)*10};
    let a,bb,c,v;do{a=R(12,26)*5;bb=R(12,26)*5;c=R(12,26)*5;v=360-a-bb-c}while(v<55||v>140);return {type:'vsum',m:'fyr',a,b:bb,c}}
};

/* ---------- 3.5 Omkrets ---------- */
function rectFig(b,w,h,lw,lh){const x=1,y=1,pts=[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];b.G={pts,x,y,w,h};reg(b,'fig',poly(b,pts,{w:3,fill:'rgba(28,95,209,.06)'}));ghostSides(b,pts,'sd');
  reg(b,'base',b.P.sd2);reg(b,'hside',b.P.sd1);
  if(lw!=null)reg(b,'lb',txt(b,[x+w/2,y+h+.5],lw,{size:.42,color:'#263238'}));if(lh!=null)reg(b,'lh',txt(b,[x+w+.75,y+h/2],lh,{size:.42,color:'#263238'}));return [x,y]}
const PENTA=[[2,6.5],[8,6.5],[9.5,3.5],[5.5,1.2],[1.2,3.2]],TRI=[[1.5,6.5],[9,6.5],[4,1.5]];
const r1=x=>Math.round(x*10+1e-9)/10,d1=x=>x.toFixed(1).replace('.',',');
function roundSteps(st,exact,piv,what,unit){
  const ex=num(exact);
  if(Math.abs(ex-r1(ex))>1e-9)st.push({say:`Avrunda ${exact} till en decimal.`,input:{type:'ask',prompt:`${exact} ≈`,val:fmt(r1(ex))},hint:'Titta på den andra decimalen. Är den 5 eller mer avrundar du uppåt.'});
  const a=d1(r1(ex)),b=d1(r1(piv));
  st.push({say:`Klart! ${what} är ungefär **${a} ${unit}**.`+(a!==b?` Med π-knappen på räknaren blir det ${b} ${unit}. Båda svaren är rätt.`:'')});
}
const circCheck=(base,x)=>[r1(3.14*base),r1(Math.PI*base),+(3.14*base).toFixed(4)].some(v=>Math.abs(v-x)<1e-6);
const PIQ=' Använd π ≈ 3,14 eller π-knappen på räknaren. Avrunda till en decimal.';
const omkrets={
  answer:p=>({q:p.m==='cirkel'?d1(r1(3.14*(p.d||2*p.r))):fmt(p.m==='rekt'?2*p.a+2*p.b:p.s.reduce((x,y)=>x+y,0))}),
  check:(p,x)=>p.m==='cirkel'?circCheck(p.d||2*p.r,x):null,
  unit:()=>'cm',
  short:p=>p.m==='rekt'?`Rektangel ${p.a} cm · ${p.b} cm`:p.m==='poly'?`Månghörning ${p.s.join(', ')} cm`:p.r?`Cirkel med radien ${p.r} cm`:`Cirkel med diametern ${p.d} cm`,
  q:p=>p.m==='rekt'?'Beräkna rektangelns <b>omkrets</b>.':p.m==='poly'?'Beräkna figurens <b>omkrets</b>.':'Beräkna cirkelns <b>omkrets</b>.'+PIQ,
  fig(b,p){
    if(p.m==='rekt')rectFig(b,p.a,p.b,`${p.a} cm`,`${p.b} cm`);
    else if(p.m==='poly'){const P=p.s.length===3?TRI:PENTA;b.G={pts:P};reg(b,'fig',poly(b,P,{w:3,fill:'rgba(28,95,209,.06)'}));ghostSides(b,P,'sd');
      P.forEach((A,i)=>{const B=P[(i+1)%P.length];reg(b,'sl',sideLabel(b,A,B,`${p.s[i]} cm`,{flip:true,off:.5}))});
      txt(b,[5.5,7.5],'Figuren är inte skalenlig.',{size:.3,color:'#90a4ae'});}
    else{const C=[5.5,4.2],r=2.9;b.G={C,r};reg(b,'circ',shp(b,{k:'circle',c:C,r,w:3,fill:'rgba(28,95,209,.06)'}));reg(b,'dot',shp(b,{k:'dot',c:C}));
      if(p.r){reg(b,'rad',seg(b,C,[C[0]+r,C[1]],{w:2.2}));reg(b,'rl',txt(b,[C[0]+r/2,C[1]+.42],`r = ${p.r} cm`,{size:.4,color:'#263238'}))}
      else{reg(b,'dia',seg(b,[C[0]-r,C[1]],[C[0]+r,C[1]],{w:2.2}));reg(b,'dl',txt(b,[C[0],C[1]+.42],`d = ${p.d} cm`,{size:.4,color:'#263238'}))}}
  },
  board(p){const b=newBoard(12,8);omkrets.fig(b,p);return b},
  lesson(p){
    const b=newBoard(12,8),st=[],ans=omkrets.answer(p).q,fig=()=>omkrets.fig(b,p),sides=n=>Array.from({length:n},(_,i)=>'sd'+i);
    if(p.m==='rekt'){
      st.push({say:'Vi ska räkna ut rektangelns omkrets. Omkretsen är längden runt hela figuren.',acts:[fig,()=>trace(b,{pts:b.G.pts})]});
      st.push({say:`En rektangel har två sidor som är ${p.a} cm och två sidor som är ${p.b} cm.`,hs:[],
        acts:[()=>{reg(b,'lw2',txt(b,[b.G.x+p.a/2,b.G.y-.45],`${p.a} cm`,{size:.42,color:VCOL}));hl(b,'sd0','sd2','lb','lw2')},
              ()=>{reg(b,'lh2',txt(b,[b.G.x-.6,b.G.y+p.b/2],`${p.b} cm`,{size:.42,color:VCOL}));hl(b,'sd0','sd2','lb','lw2','sd1','sd3','lh','lh2')}]});
      st.push({say:'Lägg ihop alla fyra sidorna.',hsN:[sides(4),'lb','lw2','lh','lh2'],acts:[()=>trace(b,{pts:b.G.pts})],input:{type:'ask',prompt:`${p.a} + ${p.b} + ${p.a} + ${p.b} =`,val:ans}});
      st.push({say:`Klart! Omkretsen är **${ans} cm**.`,hsN:[sides(4)]});
    }else if(p.m==='poly'){
      st.push({say:'Vi ska räkna ut figurens omkrets. Omkretsen är längden runt hela figuren.',acts:[fig,()=>trace(b,{pts:b.G.pts})]});
      st.push({say:'Lägg ihop längden av alla sidor.',hsN:[sides(p.s.length),'sl'],input:{type:'ask',prompt:`${p.s.join(' + ')} =`,val:ans}});
      st.push({say:`Klart! Omkretsen är **${ans} cm**.`,hsN:[sides(p.s.length)]});
    }else{const d=p.d||2*p.r,ex=fmt(3.14*d);
      st.push({say:'Vi ska räkna ut cirkelns omkrets.',acts:[fig,()=>trace(b,{c:b.G.C,r:b.G.r,a0:0})]});
      st.push({say:'Omkretsen av en cirkel får man genom att multiplicera diametern med π: O = π · d. Vi räknar med att π är ungefär 3,14.',hsN:p.d?['dia','dl']:['circ']});
      if(p.r)st.push({say:`Diametern går tvärs över hela cirkeln. Den är dubbelt så lång som radien. Räkna 2 · ${p.r}.`,hsN:['rad','rl'],
        acts:[()=>{const {C,r}=b.G;reg(b,'dia',seg(b,[C[0]-r,C[1]],[C[0]+r,C[1]],{w:2.2,dash:true,color:VCOL}));reg(b,'dl',txt(b,[C[0]-r/2,C[1]-.42],`d = 2 · ${p.r} cm`,{size:.4,color:VCOL}));hl(b,'dia','rad','rl','dl')}],
        input:{type:'ask',prompt:`2 · ${p.r} =`,val:String(d)}});
      st.push({say:`Räkna 3,14 · ${d}.`,hsN:['dia','dl','circ'],input:{type:'ask',prompt:`3,14 · ${d} =`,val:ex},hint:`Räkna 3 · ${d} och 0,14 · ${d} och lägg ihop.`});
      const k=st.length;roundSteps(st,ex,Math.PI*d,'Omkretsen','cm');st.slice(k).forEach(x=>x.hsN=['circ']);
    }
    return {board:b,steps:st};
  },
  gen(){const r=Math.random();
    if(r<.35){let a,bb;do{a=R(3,9);bb=R(2,5)}while(a===bb);return {type:'omkrets',m:'rekt',a,b:bb}}
    if(r<.65){const n=Math.random()<.5?3:5;return {type:'omkrets',m:'poly',s:Array.from({length:n},()=>R(3,9))}}
    return Math.random()<.5?{type:'omkrets',m:'cirkel',r:R(2,10)}:{type:'omkrets',m:'cirkel',d:pick([4,6,8,10,12,20])}}
};

/* ---------- 3.6 Area ---------- */
const area={
  answer:p=>({q:fmt(p.m==='tri'?p.b*p.h/2:p.b*p.h)}),
  unit:()=>'cm²',
  short:p=>`${p.m==='rekt'?'Rektangel':p.m==='para'?'Parallellogram':'Triangel'}: b = ${p.b} cm, h = ${p.h} cm`,
  q:p=>`Beräkna ${p.m==='rekt'?'rektangelns':p.m==='para'?'parallellogrammets':'triangelns'} <b>area</b>.`,
  fig(b,p){const x=1,y=1+(5-p.h),B=p.b,H=p.h;
    if(p.m==='rekt'){rectFig(b,B,H,`${B} cm`,`${H} cm`);return}
    const off=p.m==='para'?2:Math.min(B-1,Math.max(1,Math.round(B*.35)));
    const pts=p.m==='para'?[[x,y+H],[x+B,y+H],[x+B+off,y],[x+off,y]]:[[x,y+H],[x+B,y+H],[x+off,y]];b.G={pts,x,y,B,H,off};
    reg(b,'fig',poly(b,pts,{w:3,fill:'rgba(28,95,209,.06)'}));reg(b,'base',seg(b,pts[0],pts[1],{w:3,ghost:true}));
    reg(b,'hgt',seg(b,[x+off,y],[x+off,y+H],{w:2,dash:true,color:'#546e7a'}));reg(b,'rt',shp(b,{k:'right',c:[x+off,y+H],a0:0,color:'#546e7a'}));
    reg(b,'lb',txt(b,[x+B/2,y+H+.5],`b = ${B} cm`,{size:.4,color:'#263238'}));reg(b,'lh',txt(b,[x+off+.25,y+H/2],`h = ${H} cm`,{size:.4,color:'#263238',align:'left'}));
  },
  board(p){const b=newBoard(12,8);area.fig(b,p);return b},
  lesson(p){
    const off=p.m==='tri'?Math.min(p.b-1,Math.max(1,Math.round(p.b*.35))):0,cols=p.m==='tri'?Math.max(12,Math.ceil(1+off+p.b+.8)):12;
    const b=newBoard(cols,8),st=[],ans=area.answer(p).q,bh=p.b*p.h,fig=()=>area.fig(b,p);
    if(p.m==='rekt'){
      st.push({say:'Arean är hur stor yta figuren täcker. Den mäts i kvadratcentimeter. En ruta på rutpappret är som 1 cm².',
        acts:[fig,()=>{const {x,y,w,h}=b.G;
          reg(b,'unit',poly(b,[[x,y+h-1],[x+1,y+h-1],[x+1,y+h],[x,y+h]],{ghost:true,w:2.5}));reg(b,'ul',txt(b,[x+.5,y+h-.5],'1 cm²',{size:.24,color:'#263238',ghost:true}));hl(b,'unit','ul')}]});
      st.push({say:'Arean av en rektangel är basen gånger höjden.',hsN:['base','hside','lb','lh']});
      st.push({say:`Räkna ${p.b} · ${p.h}.`,hsN:['fig','lb','lh'],input:{type:'ask',prompt:`${p.b} · ${p.h} =`,val:ans}});
      st.push({say:`Klart! Arean är **${ans} cm²**.`,hsN:['fig']});
    }else if(p.m==='para'){
      st.push({say:'Det här är ett parallellogram. Höjden är den streckade linjen. Den står vinkelrätt mot basen.',acts:[fig,()=>hl(b,'hgt','rt','lh')]});
      st.push({say:'Arean av ett parallellogram är basen gånger höjden, precis som för en rektangel.',hs:[],
        acts:[()=>{const {x,y,H,off}=b.G;reg(b,'cut',poly(b,[[x,y+H],[x+off,y+H],[x+off,y]],{ghost:true,noStroke:true,hfill:'rgba(240,140,0,.32)'}));hl(b,'cut','hgt')},
              ()=>{const {x,y,B,H,off}=b.G;reg(b,'moved',poly(b,[[x+B,y+H],[x+B+off,y+H],[x+B+off,y]],{w:2,dash:true,color:VCOL,fill:'rgba(240,140,0,.25)'}));
                reg(b,'moved',seg(b,[x+B+off,y],[x+B+off,y+H],{w:2,dash:true,color:VCOL}));hl(b,'cut','hgt','moved')},
              ()=>{const {x,y,B,H,off}=b.G;reg(b,'rect',poly(b,[[x+off,y],[x+B+off,y],[x+B+off,y+H],[x+off,y+H]],{ghost:true,w:3,hfill:'rgba(240,140,0,.10)'}));hl(b,'rect','base','lb','lh')}]});
      st.push({say:`Räkna ${p.b} · ${p.h}.`,pre:()=>kill(b,'moved'),hsN:['base','hgt','lb','lh'],input:{type:'ask',prompt:`${p.b} · ${p.h} =`,val:ans},hint:'Använd höjden, inte den sneda sidan.'});
      st.push({say:`Klart! Arean är **${ans} cm²**.`,hsN:['fig']});
    }else{
      st.push({say:'Det här är en triangel. Höjden är den streckade linjen. Den står vinkelrätt mot basen.',acts:[fig,()=>hl(b,'hgt','rt','lh')]});
      st.push({say:'En triangel är hälften av ett parallellogram. Arean är därför basen gånger höjden delat med 2.',hs:[],

const PNAMN={3:'triangel',4:'fyrhörning',5:'femhörning',6:'sexhörning',7:'sjuhörning',8:'åttahörning'};
function regPoly(n,C,r){const o=[],a0=-90-180/n;for(let i=0;i<n;i++){const a=(a0+i*360/n)*D2R;o.push([C[0]+r*Math.cos(a),C[1]-r*Math.sin(a)])}
  const ys=o.map(p=>p[1]),dy=(C[1]+r*.9)-Math.max(...ys);return o.map(p=>[p[0],p[1]+dy])}
function tick(b,A,B,n){n=n||1;const m=[(A[0]+B[0])/2,(A[1]+B[1])/2],dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy),u=[dx/L,dy/L],nv=[-dy/L*.22,dx/L*.22];
  const ids=[];for(let k=0;k<n;k++){const o=(k-(n-1)/2)*.16;ids.push(seg(b,[m[0]+u[0]*o-nv[0],m[1]+u[1]*o-nv[1]],[m[0]+u[0]*o+nv[0],m[1]+u[1]*o+nv[1]],{w:2.2}))}return reg(b,'ticks',ids)}
const FYR=['kvadrat','rektangel','romb','parallellogram','parallelltrapets'],TRT=['liksidig','likbent','rätvinklig'];

  short:p=>p.m==='namn'?'Vad heter månghörningen?':p.m==='tri'?'Vilken sorts triangel?':'Vilken sorts fyrhörning?',

  fig(b,p){const F='rgba(28,95,209,.06)',RT=(c,a0)=>reg(b,'rt',shp(b,{k:'right',c,a0}));
    if(p.m==='namn'){const P=regPoly(p.n,[5.5,3.8],2.9);b.G={pts:P};reg(b,'fig',poly(b,P,{w:3,fill:F}));P.forEach(q=>reg(b,'vx',shp(b,{k:'dot',c:q,ghost:true})));return}
    if(p.m==='tri'){
      if(p.k==='liksidig'){const T=triPts(60,60),[A,B,C]=T;b.G={pts:T};reg(b,'fig',poly(b,T,{w:3,fill:F}));[[A,B],[B,C],[C,A]].forEach(([P,Q])=>{tick(b,P,Q,1);reg(b,'sl',outLabel(b,P,Q,`${p.s} cm`,T,.75))})}
      else if(p.k==='likbent'){const T=triPts(65,65),[A,B,C]=T;b.G={pts:T};reg(b,'fig',poly(b,T,{w:3,fill:F}));tick(b,A,C,1);tick(b,B,C,1);reg(b,'sl',outLabel(b,C,A,`${p.s} cm`,T,.85));reg(b,'sl',outLabel(b,B,C,`${p.s} cm`,T,.85));outLabel(b,A,B,`${p.t} cm`,T,.5)}
      else{const A=[2,6.5],B=[8.5,6.5],C=[2,2];b.G={pts:[A,B,C]};reg(b,'fig',poly(b,[A,B,C],{w:3,fill:F}));RT(A,0);sideLabel(b,A,B,`${p.s} cm`,{flip:true,off:.45});sideLabel(b,C,A,`${p.t} cm`,{flip:true,off:.6})}
      ghostSides(b,b.G.pts,'sd');return}
    const x=2,y=2.2;let pts;
    if(p.k==='kvadrat')pts=[[x,y],[x+4,y],[x+4,y+4],[x,y+4]];

    }
    return {board:b,steps:st};
  },
  gen(){const r=Math.random();

const WORD_OR={2:'tvåor',3:'treor',4:'fyror',5:'femmor',6:'sexor',7:'sjuor',8:'åttor',9:'nior',1:'ettor',0:'nollor'};
const WORD_AN={0:'nollan',1:'ettan',2:'tvåan',3:'trean',4:'fyran',5:'femman',6:'sexan',7:'sjuan',8:'åttan',9:'nian'};
function speechText(t){
  return t.replace(/\*\*/g,'').replace(/(\d+):or/g,(m,d)=>WORD_OR[d]||m).replace(/(\d+):an/g,(m,d)=>WORD_AN[d]||m)
   .replace(/1:a/g,'etta').replace(/cm²/g,' kvadratcentimeter').replace(/(\w)²/g,'$1 i kvadrat').replace(/([A-Za-zÅÄÖåäö]) = /g,'$1 är lika med ').replace(/(?<![\p{L}])(kg)(?![\p{L}\d])/gu,'kilogram').replace(/(?<![\p{L}])(hg)(?![\p{L}\d])/gu,'hekto').replace(/(?<![\p{L}])(mg)(?![\p{L}\d])/gu,'milligram').replace(/(?<![\p{L}])(dag)(?![\p{L}\d])/gu,'dekagram').replace(/(?<![\p{L}])(g)(?![\p{L}\d])/gu,'gram').replace(/(?<![\p{L}])(dl)(?![\p{L}\d])/gu,'deciliter').replace(/(?<![\p{L}])(cl)(?![\p{L}\d])/gu,'centiliter').replace(/(?<![\p{L}])(ml)(?![\p{L}\d])/gu,'milliliter').replace(/(?<![\p{L}])(l)(?![\p{L}\d])/gu,'liter').replace(/(?<![\p{L}])(km)(?![\p{L}\d])/gu,'kilometer').replace(/(?<![\p{L}])(dm)(?![\p{L}\d])/gu,'decimeter').replace(/(?<![\p{L}])(cm)(?![\p{L}\d])/gu,'centimeter').replace(/(?<![\p{L}])(mm)(?![\p{L}\d])/gu,'millimeter').replace(/(?<![\p{L}])(m)(?![\p{L}\d])/gu,'meter').replace(/(\d)°/g,'$1 grader').replace(/°/g,' grader').replace(/π/g,'pi').replace(/(\d) ?km\b/g,'$1 kilometer').replace(/(\d) ?dm\b/g,'$1 decimeter').replace(/(\d) ?cm\b/g,'$1 centimeter').replace(/(\d) ?mm\b/g,'$1 millimeter').replace(/(\d) m(?![\p{L}\d])/gu,'$1 meter').replace(/(\d)\s*−\s*(\d)/g,'$1 minus $2').replace(/−/g,' minus ').replace(/·/g,' gånger ')
   .replace(/(\d)\s*\/\s*(\d)/g,'$1 delat med $2').replace(/=/g,' är ').replace(/–/g,',').replace(/[^\p{L}\p{N}\s.,!?:]/gu,' ');
}
let svVoice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();svVoice=v.find(x=>/^sv/i.test(x.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function canSpeak(){return S.sound&&'speechSynthesis' in window}
function speak(text){
  if(!canSpeak()) return null;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(speechText(text));u.lang='sv-SE';if(svVoice)u.voice=svVoice;u.rate=.88;
    const pr=new Promise(res=>{u.onend=res;u.onerror=res});speechSynthesis.speak(u);return pr;
  }catch(e){return null}
}
function hush(){try{speechSynthesis.cancel()}catch(e){}try{audioEl.pause()}catch(e){}}
const audioEl=new Audio();audioEl.preload='auto';
function playLine(topic,n){
  const hv=AUDIO_HAVE[topic];if(!S.sound||n==null||!hv||(Array.isArray(hv)&&!hv.includes(n)))return null;
  return new Promise(res=>{let done=false;const fin=()=>{if(!done){done=true;res()}};
    audioEl.onended=fin;audioEl.onerror=fin;audioEl.src=`audio/${topic}-${String(n).padStart(3,'0')}.mp3`;
    const p=audioEl.play();if(p&&p.catch)p.catch(fin)});
}

function say(text,topic,n){try{speechSynthesis.cancel()}catch(e){}const a=playLine(topic,n);return a||speak(text)}

const paper=$('#paper'),ink=$('#ink'),pc=paper.getContext('2d'),ic=ink.getContext('2d');
let dpr=1,dirtyUntil=0;
function touch(){dirtyUntil=performance.now()+700;kick()}
function layout(){
  const w=innerWidth,h=innerHeight;
  const land=w>=h*1.1&&w>=720;
  document.body.classList.toggle('land',land);document.body.classList.toggle('port',!land);
  document.body.classList.toggle('wide',!land&&w>=600);
  S.cs=Math.max(42,Math.min(60,Math.round(Math.min(w,h)/13)));
  dpr=window.devicePixelRatio||1;
  for(const c of [paper,ink]){c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px'}
  const topH=$('#top').getBoundingClientRect().bottom;
  const panel=$('#panel');
  if(land) panel.style.top=(topH+10)+'px'; else panel.style.top='';
  const tools=$('#tools');tools.style.top=(topH+10)+'px';
  const cs=S.cs;let ax=70,ay=topH,aw=w-ax,ah=h-ay;
  if(!panel.classList.contains('hide')){const pr=panel.getBoundingClientRect();if(land)aw=pr.left-ax-6;else ah=pr.top-ay-6}
  if(S.board){
    const b0=S.board;S.cs=Math.max(32,Math.min(S.cs,Math.floor(aw/(b0.cols+.3)),Math.floor(ah/(b0.rows+.6))));
  }
  if(S.board){
    const cs=S.cs,b=S.board,bw=b.cols*cs,bh=b.rows*cs;
    let c=Math.max(Math.ceil(ax/cs),Math.round((ax+Math.max(0,(aw-bw)/2))/cs));
    let r=Math.round((ay+Math.max(0,(ah-bh)*.35))/cs);
    r=Math.max(r,Math.ceil(ay/cs));
    if(S.board.rows===3) r=Math.max(r,Math.ceil(ay/cs)+1);
    S.O={c,r};
  }
  touch();drawInk();
}

    else if(sh.k==='poly'){ctx.beginPath();sh.pts.forEach((q,i)=>i?ctx.lineTo(X(q[0]),Y(q[1])):ctx.moveTo(X(q[0]),Y(q[1])));ctx.closePath();
      if(hlx){ctx.save();ctx.shadowBlur=0;ctx.fillStyle=sh.hfill||HLF(.14+.1*pul);ctx.fill();ctx.restore()}else if(sh.fill){ctx.fillStyle=sh.fill;ctx.fill()}

    else if(sh.k==='dot'){ctx.beginPath();ctx.arc(X(sh.c[0]),Y(sh.c[1]),cs*(hlx?.13+.04*pul:.07),0,Math.PI*2);ctx.fill()}

      // halvcirkel (gradskiva)

      ctx.fillStyle='rgba(28,126,214,.07)';ctx.fill();ctx.strokeStyle='rgba(28,126,214,.55)';ctx.lineWidth=1.6*(cs/56);ctx.stroke();

      ctx.globalAlpha=t;ctx.font=`700 ${.28*cs}px ${DIGF}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=PB;

      for(const d of (sh.marks||[])){const dv=dirv(sh.a0+d);ctx.strokeStyle=VCOL;ctx.lineWidth=2.4*(cs/56);ctx.setLineDash([cs*.12,cs*.1]);ctx.beginPath();ctx.moveTo(X(c[0]),Y(c[1]));ctx.lineTo(X(c[0]+dv[0]*r),Y(c[1]+dv[1]*r));ctx.stroke();ctx.setLineDash([])}

      let hx,hy;

/* ================= Ink ================= */
let curStroke=null,penId=null;
function toLocal(e){return [e.clientX/S.cs-S.O.c,e.clientY/S.cs-S.O.r,e.pointerType==='pen'?(e.pressure||.5):.5]}
ink.addEventListener('pointerdown',e=>{
  if(e.pointerType==='pen')S.penSeen=true;
  if(S.penSeen&&e.pointerType==='touch')return;
  if(penId!==null)return;
  penId=e.pointerId;try{ink.setPointerCapture(e.pointerId)}catch(_){}
  clearTimeout(S.recT);
  if(S.tool==='eraser'){eraseAt(e);return}
  curStroke={pts:[toLocal(e)],pen:e.pointerType==='pen'};S.strokes.push(curStroke);S.cleared=null;drawInk();
});
ink.addEventListener('pointermove',e=>{
  if(e.pointerId!==penId)return;
  if(S.tool==='eraser'){eraseAt(e);return}
  if(!curStroke)return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of (evs.length?evs:[e]))curStroke.pts.push(toLocal(ev));
  drawInk();
});
function endStroke(e){if(e.pointerId!==penId)return;penId=null;curStroke=null;
  if(S.mode==='learn'&&S.hand&&S.inp&&S.inp.st.input.type==='cells'){clearTimeout(S.recT);S.recT=setTimeout(recogCells,800)}}
function sbox(pts){let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;for(const p of pts){x1=Math.min(x1,p[0]);y1=Math.min(y1,p[1]);x2=Math.max(x2,p[0]);y2=Math.max(y2,p[1])}return {x1,y1,x2,y2,cx:(x1+x2)/2,cy:(y1+y2)/2}}
function recogCells(){
  const I=S.inp;if(!I||I.lock||I.st.input.type!=='cells')return;
  const cells=I.st.input.cells,groups=cells.map(()=>[]);
  const ctr=cells.map(([c,r,k])=>k==='pre'?[c+.2,r+.32]:k==='memo'?[c+.35,r+.6]:[c+.5,r+.5]);
  for(const st of S.strokes){const b=sbox(st.pts);let best=-1,bd=.95;
    ctr.forEach(([x,y],k)=>{const d=Math.hypot(b.cx-x,b.cy-y);if(d<bd){bd=d;best=k}});
    if(best>=0)groups[best].push(st)}
  if(groups.some(g=>!g.length))return;
  const digits=groups.map(g=>{const r=NET.recognize(g.map(st=>st.pts.map(p=>[p[0],p[1]])));return r?r.d:'?'});
  const used=new Set(groups.flat());S.strokes=S.strokes.filter(st=>!used.has(st));drawInk();
  I.buf=digits.join('');I.viaHand=true;reflectCells(I);checkInput();
}
ink.addEventListener('pointerup',endStroke);ink.addEventListener('pointercancel',endStroke);
function eraseAt(e){
  const [x,y]=toLocal(e),rr=.32;let ch=false;
  for(let i=S.strokes.length-1;i>=0;i--){if(S.strokes[i].pts.some(p=>Math.hypot(p[0]-x,p[1]-y)<rr)){S.strokes.splice(i,1);ch=true}}
  if(ch)drawInk();
}
function drawInk(){
  const ctx=ic,cs=S.cs;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);
  ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#22325c';
  const X=p=>(p[0]+S.O.c)*cs,Y=p=>(p[1]+S.O.r)*cs,base=Math.max(2.6,cs*.065);
  for(const s of S.strokes){
    const P=s.pts;
    if(P.length===1){ctx.fillStyle='#22325c';ctx.beginPath();ctx.arc(X(P[0]),Y(P[0]),base/2,0,7);ctx.fill();continue}
    for(let i=1;i<P.length;i++){
      ctx.lineWidth=s.pen?base*(.55+.9*P[i][2]):base;
      ctx.beginPath();ctx.moveTo(X(P[i-1]),Y(P[i-1]));ctx.lineTo(X(P[i]),Y(P[i]));ctx.stroke();
    }

function setTool(t){S.tool=t;document.querySelectorAll('#tools [data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===t))}
function undoInk(){if(S.cleared){S.strokes.push(...S.cleared);S.cleared=null}else S.strokes.pop();drawInk()}
function clearInk(){if(!S.strokes.length)return;S.cleared=S.strokes.splice(0);drawInk()}

function segment(strokes){ // dela upp fri handskrift i siffror från vänster till höger

  let changed=true;
  while(changed){changed=false;
    outer:for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++){
      const A=g[i].b,B=g[j].b,ov=Math.min(A.x2,B.x2)-Math.max(A.x1,B.x1),mw=Math.min(A.x2-A.x1,B.x2-B.x1);
      const inside=(A.cx>=B.x1&&A.cx<=B.x2)||(B.cx>=A.x1&&B.cx<=A.x2);
      if(ov>-2&&(ov>=.5*mw||inside)){const s2=g[i].s.concat(g[j].s);g[i]={s:s2,b:sbox(s2.flat())};g.splice(j,1);changed=true;break outer}
    }}

      }
      else if(st.input.type==='choice'){const sel=I?(I.shown||''):(S.stepDone?st.input.val:'');
        zone=`<div class="row chs">${st.input.options.map(o=>`<button class="btn ch ${sel===o?(o===st.input.val?'pri':'org'):''}" data-ch="${o}" ${!I||I.lock?'disabled':''}>${o}</button>`).join('')}</div>`}
      else zone=S.hand?`<div class="hintc">✏️ Skriv siffran i den <b>orange rutan</b> på rutpappret. Appen läser den när du har lyft pennan.</div>`
                      :`<div class="hintc">✏️ Tryck på siffran som ska stå i den <b>orange rutan</b>.</div>`;
    }
    P.innerHTML=head(`Genomgång${S.exNo>=0?` · Exempel ${S.exNo+1} av ${nex(S.topic)}`:''}${isGeo(S.prob)?'':' · '+ptext(S.prob)}`)+
      `<div class="prog"><i style="width:${Math.round(100*S.si/S.steps.length)}%"></i></div>
       <div class="say">${mdf(st.say)}</div>${zone}<div class="fb ${S.fbc}">${S.fb}</div>
       ${st.input&&st.input.type!=='choice'&&!S.hand?KEYPAD(!I||I.lock,isGeo(S.prob)):''}<div class="row" id="ctl">${ctlHTML()}</div>${modeBtn()}`;
    return;
  }
  if(S.mode==='practice'){
    const pr=S.prac,isRest=S.prob.type==='rest';
    P.innerHTML=head(`Öva · ⭐ ${pr.streak} rätt i rad`)+
     `${S.subF&&S.subF.tp===S.topic?`<div class="subtag">Tränar: ${S.subF.s}<button data-a="clrsub" aria-label="Ta bort">✕</button></div>`:''}${taskHTML(S.prob)}${S.topic==='enh'?enhFilter():''}
      ${ansBox(isRest)}<div class="fb ${S.fbc}">${S.fb}</div>
      ${pr.state==='answer'&&!S.hand&&ansKind(S.prob)!=='choice'?KEYPAD(false,allowDec(S.prob)):''}
      <div class="row">${pr.state==='answer'?`<button class="btn pri" data-a="check">Rätta ✓</button>`:`<button class="btn pri" data-a="newprob">Nästa uppgift →</button>`}</div>
      <div class="row"><button class="btn ${pr.tries>=2?'org':''}" data-a="showhow">💡 Visa hur</button>${pr.state==='answer'?`<button class="btn" data-a="newprob">Ny uppgift</button>`:''}</div>${modeBtn()}`;
    return;
  }
  if(S.mode==='test'){
    const t=S.test,it=t.items[t.i],isRest=it.p.type==='rest';
    P.innerHTML=`<div class="ptitle"><span class="nr o">📝</span>Träningsprov</div><div class="sub">Uppgift ${t.i+1} av ${t.items.length} · ${T(it.p.type).name}</div>
      <div class="dots">${t.items.map((x,i)=>`<button data-go="${i}" class="${x.ans.q!==''?'has':''} ${i===t.i?'cur':''}">${i+1}</button>`).join('')}</div>
      ${taskHTML(it.p)}
      ${ansBox(isRest)}${S.hand||ansKind(it.p)==='choice'?'':KEYPAD(false,allowDec(it.p))}
      <div class="row"><button class="btn" data-a="tprev" ${t.i===0?'disabled style="opacity:.4"':''}>← Förra</button><button class="btn blue" data-a="tnext" ${t.i===t.items.length-1?'disabled style="opacity:.4"':''}>Nästa →</button></div>
      <div class="row"><button class="btn org" data-a="submit">Lämna in provet</button></div>${modeBtn()}`;
    return;
  }
  if(S.mode==='review'){
    const it=S.test.items[S.test.rev],a=answer(it.p),ok=isCorrect(it);
    P.innerHTML=`<div class="ptitle"><span class="nr o">📝</span>Uppgift ${S.test.rev+1}</div>${taskHTML(it.p)}
      <div class="say ${ok?'done':''}">Ditt svar: <b>${fmtA(it.p,it.ans)}</b> ${ok?'✅':'❌'}<br>Rätt svar: <b>${fmtA(it.p,a)}</b></div>
      <div class="sub" style="margin-top:0">Här ser du det du skrev på rutpappret.</div>
      <div class="row"><button class="btn blue" data-a="revhow">💡 Visa hur man räknar</button></div>
      <div class="row"><button class="btn pri" data-a="backres">Tillbaka till resultatet</button></div>`;
  }
}
function enhFilter(){const on=S.enhKinds&&S.enhKinds.length?S.enhKinds:['längd','vikt','volym'];
  return `<div class="row ekf"><span class="sub" style="margin:0">Öva på:</span>${['längd','vikt','volym'].map(k=>`<button class="chip ${on.includes(k)?'on':''}" data-a="ek" data-k2="${k}">${k}</button>`).join('')}</div>`}
function modeBtn(){return `<div class="row"><button class="btn sm modeb" data-a="hand">${S.hand?'⌨️ Använd knappar istället':'✍️ Skriv för hand istället'}</button></div>`}
function ansBox(isRest){
  const A=S.ans,p=S.prob,u=unitOf(p);
  if(ansKind(p)==='choice')return `<div class="ansbox"><div class="anslbl">Välj ditt svar</div><div class="row chs">${GEO[p.type].choices(p).map(o=>`<button class="btn ch ${A.q===o?'blue':''}" data-pick="${o}">${o}</button>`).join('')}</div></div>`;
  const unitTag=u?`<span class="unit">${u}</span>`:'';
  if(S.hand) return `<div class="ansbox"><div class="anslbl">✏️ Skriv ditt svar här</div>
   <div class="padrow"><canvas data-pad="q" data-n="9"></canvas>${unitTag}</div>
   ${isRest?`<div class="padrow"><span class="restl">rest</span><canvas data-pad="r" data-n="1"></canvas></div>`:''}
   <div class="reads">Jag läser: <b id="read-q">${A.q||'–'}</b>${isRest?` rest <b id="read-r">${A.r||'–'}</b>`:''}<button class="padclr" data-a="padclr" data-p="${isRest?'q,r':'q'}">✕ Sudda</button></div></div>`;
  return `<div class="ansbox"><div class="anslbl">✏️ Skriv ditt svar här när du har räknat klart</div>
   <div class="ansrow">Svar: <span class="af ${A.f==='q'?'on':''}" data-f="q">${A.q||'&nbsp;'}</span>${unitTag}
   ${isRest?`rest <span class="af sm ${A.f==='r'?'on':''}" data-f="r">${A.r||'&nbsp;'}</span>`:''}</div></div>`;
}
function answerKey(k){
  const A=S.ans;
  if(S.mode==='practice'&&S.prac.state!=='answer')return;
  if(k==='ok'){if(S.mode==='practice')checkPractice();else if(S.mode==='test'){const isRest=S.test.items[S.test.i].p.type==='rest';if(isRest&&A.f==='q'&&A.q){A.f='r'}else testNext()}renderPanel();return}
  if(k==='del')A[A.f]=A[A.f].slice(0,-1);
  else if(k===','){if(A.f==='q'&&allowDec(S.prob)&&!A.q.includes(','))A.q+=','}
  else if(A[A.f].length<(A.f==='q'?7:2))A[A.f]+=k;
  if(S.mode==='practice'){S.fb='';S.fbc=''}
  renderPanel();
}

/* ================= Practice ================= */
function startPractice(id,sub){
  S.subF=sub?{tp:id,s:sub}:null;
  stopLesson();S.mode='practice';S.topic=id;S.prac={streak:0,tries:0,state:'answer'};enterWork();newPracticeProblem();
}
function newPracticeProblem(prob){
  if(!prob&&S.subF&&S.subF.tp===S.topic){for(let i=0;i<400;i++){const q=GEN[S.topic]();if(subOf(q)===S.subF.s){prob=q;break}}}
  S.prob=prob||GEN[S.topic]();S.logged=false;S.board=bareBoard(S.prob);S.strokes=[];S.cleared=null;
  S.ans=newAns();S.prac.tries=0;S.prac.state='answer';S.fb='';S.fbc='';renderPanel();layout();
}
function checkPractice(){
  const A=S.ans,a=answer(S.prob),isRest=S.prob.type==='rest';
  if(A.q===''||(isRest&&A.r==='')){S.fb=isRest?'Skriv både svaret och resten.':ansKind(S.prob)==='choice'?'Välj ett svar först.':'Skriv ditt svar i rutan först.';S.fbc='bad';renderPanel();return}
  const ok=isRight(S.prob,A);
  if(!S.logged){S.logged=true;LOG.add({k:'p',tp:S.topic,s:subOf(S.prob),ok:ok?1:0})}
  if(ok){S.prac.streak++;S.prac.state='done';store.add(S.topic);
    S.fbI=R(0,3);S.fb=['Rätt! Snyggt räknat! 🎉','Rätt! Du är grym! 🌟','Helt rätt! 💪','Rätt! Bra jobbat! 🎉'][S.fbI];S.fbc='ok';
    say(S.fb.replace(/[^\p{L}\s!]/gu,''),'gen',GEN_LINES.praise[S.fbI]);
  }else{S.prac.tries++;S.prac.streak=0;
    S.fb=S.prac.tries>=2?'Inte riktigt. Tryck på ”Visa hur” så går vi igenom den tillsammans.':'Inte riktigt. Kolla din uträkning en gång till!';S.fbc='bad';}
  renderPanel();
}

/* ================= Test ================= */
function startTest(){
  stopLesson();
  const items=[];TOPICS.forEach(t=>{items.push(GEN[t.id]());items.push(GEN[t.id]())});
  S.test={items:shuffle(items).map(p=>({p,ans:newAns(),strokes:[]})),i:0,rev:null};
  S.mode='test';enterWork();showTestItem(0);
}
function showTestItem(i){
  const t=S.test;t.i=i;const it=t.items[i];
  S.prob=it.p;S.topic=it.p.type;S.board=bareBoard(it.p);S.strokes=it.strokes;S.ans=it.ans;S.cleared=null;
  renderChips();renderPanel();layout();
}
function testNext(){if(S.test.i<S.test.items.length-1)showTestItem(S.test.i+1)}
function isCorrect(it){return isRight(it.p,it.ans)}
function askSubmit(){
  const left=S.test.items.filter(x=>x.ans.q==='').length;
  if(!left){showResult();return}
  $('#ov').classList.remove('hide');
  $('#ov').innerHTML=`<div class="card" style="max-width:420px"><h2>Lämna in?</h2><p>Du har ${left} ${left===1?'uppgift':'uppgifter'} utan svar.</p>
   <div class="row"><button class="btn" data-a="closeov">Fortsätt räkna</button><button class="btn org" data-a="doresult">Lämna in ändå</button></div></div>`;
}
function showResult(){
  stopLesson();S.mode='result';const t=S.test;const n=t.items.filter(isCorrect).length;
  if(!t.logged){t.logged=true;const x=Date.now().toString(36);t.items.forEach(it=>LOG.add({k:'t',x,tp:it.p.type,s:subOf(it.p),ok:isCorrect(it)?1:0}))}
  $('#panel').classList.add('hide');S.board=null;S.strokes=[];drawInk();touch();renderChips();
  const msg=n===t.items.length?'Alla rätt! Du är redo för provet! 🏆':n>=t.items.length*.75?'Jättebra! Titta på de som blev fel. 🌟':n>=t.items.length*.5?'Bra kämpat! Öva lite till på de som blev fel. 💪':'Du är på väg! Titta på genomgångarna och öva lite till. 💪';
  $('#ov').classList.remove('hide');
  $('#ov').innerHTML=`<div class="card"><h2>Resultat – Träningsprov</h2>
   <div class="score pop">${n} / ${t.items.length}</div><p>${msg} Tryck på en uppgift för att se den igen.</p>
   <div class="res">${t.items.map((it,i)=>{const ok=isCorrect(it),a=answer(it.p);
     return `<button data-rev="${i}"><span class="mk">${ok?'✅':'❌'}</span><span class="q">${i+1}. ${ptext(it.p)}</span>
     <span class="a">Ditt: ${fmtA(it.p,it.ans)}${ok?'':` · Rätt: ${fmtA(it.p,a)}`}</span></button>`}).join('')}</div>
   <div class="row"><button class="btn blue" data-a="test">Gör ett nytt prov</button><button class="btn" data-a="results">📊 Mina resultat</button><button class="btn" data-a="menu">Till menyn</button></div></div>`;
}
function review(i){
  S.mode='review';S.test.rev=i;const it=S.test.items[i];S.prob=it.p;S.topic=it.p.type;S.board=bareBoard(it.p);S.strokes=it.strokes;
  enterWork();renderPanel();layout();
}

/* ================= Events ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-goto],[data-a],[data-k],[data-topic],[data-learn],[data-prac],[data-tool],[data-f],[data-go],[data-rev],[data-ch],[data-pick],[data-prof]');if(!el)return;
  const d=el.dataset;
  if(d.goto){goTopic(d.p,d.goto,d.m,d.s);return}
  if(d.ch!=null){if(S.mode==='learn'&&S.inp&&!S.inp.lock&&S.inp.st.input.type==='choice'){S.inp.buf=d.ch;S.inp.shown=d.ch;checkInput()}return}
  if(d.pick!=null){if(S.mode==='practice'&&S.prac.state!=='answer')return;S.ans.q=d.pick;S.fb='';S.fbc='';renderPanel();return}
  if(d.prof!=null){setProfile(d.prof);return}
  if(d.k!=null){if(S.mode==='learn')learnKey(d.k);else if(S.mode==='practice'||S.mode==='test')answerKey(d.k);return}
  if(d.tool){setTool(d.tool);return}
  if(d.f){S.ans.f=d.f;renderPanel();return}
  if(d.topic){S.exK=0;startLesson(d.topic);return}
  if(d.learn){S.exK=0;startLesson(d.learn);return}
  if(d.prac){startPractice(d.prac);return}
  if(d.go!=null){showTestItem(+d.go);return}
  if(d.rev!=null){review(+d.rev);return}
  const a=d.a;
  ({
    menu:showMenu, test:startTest, undo:undoInk, clear:clearInk,
    sound(){S.sound=!S.sound;try{localStorage.setItem('kap2sound',S.sound?'1':'0')}catch(_){}if(!S.sound)hush();renderChips()},
    pause(){S.paused=!S.paused;if(S.paused)hush();renderControls()},
    next(){if(S.skipFn){hush();S.skipFn()}},
    restart(){startLesson(S.topic,S.prob,S.returnTo)},
    again(){const k=S.exNo>=0?S.exNo+1:S.exK+1;S.exK=k%nex(S.topic);const rt=S.returnTo;startLesson(S.topic,example(S.topic,S.exK),rt==='result'?null:rt)},
    topractice(){startPractice(S.topic)},
    backprac(){S.mode='practice';stopLesson();enterWork();newPracticeProblem()},
    results(){showResults(el.dataset.p||S.profile)},
    clrsub(){S.subF=null;newPracticeProblem()},
    backres(){showResult()},
    check:checkPractice,
    newprob(){newPracticeProblem()},
    showhow(){const p=S.prob;if(!S.logged){S.logged=true;LOG.add({k:'p',tp:S.topic,s:subOf(p),ok:0,h:1})}startLesson(S.topic,p,'practice')},
    tprev(){if(S.test.i>0)showTestItem(S.test.i-1)},
    tnext:testNext, submit:askSubmit,
    ek(){const k=el.dataset.k2;let on=S.enhKinds&&S.enhKinds.length?S.enhKinds.slice():['längd','vikt','volym'];on=on.includes(k)?on.filter(x=>x!==k):on.concat(k);if(!on.length)return;S.enhKinds=on;try{localStorage.setItem('mx-enh',JSON.stringify(on))}catch(_){}newPracticeProblem()},
    closeov:hideOv, doresult:showResult, profiles:showProfiles,
    chap(){S.chapter=el.dataset.c;TOPICS=CHAPTERS[S.chapter].topics;showMenu()},
    hand(){S.hand=!S.hand;try{localStorage.setItem('kap2hand',S.hand?'1':'0')}catch(_){}if(S.inp){S.inp.buf='';S.inp.pad={strokes:[]}}renderPanel()},
    padclr(){el.dataset.p.split(',').forEach(k=>{const st=padStore(k);if(st&&st.clear)st.clear()})},
    revhow(){startLesson(S.prob.type,S.prob,'result')}
  })[a]?.();
});
document.addEventListener('keydown',e=>{
  let k=null;if(/^[0-9]$/.test(e.key))k=e.key;else if(e.key==='Backspace')k='del';else if(e.key==='Enter')k='ok';
  if(!k)return;e.preventDefault();
  if(S.mode==='learn')learnKey(k);else if(S.mode==='practice'||S.mode==='test')answerKey(k);
});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ================= Konto på paltpixel.se ================= */
// Inloggad: resultaten sparas på användarens konto. En förälder som skrivit in barnets
// Google-konto i Veckopalten (Familj) ser barnets resultat.
const KONTO={sb:null,user:null,barn:null,
  async init(){try{
    const K=window.PPKonto;if(!K||!K.harKonto)return;
    this.sb=await K.klient();if(!this.sb)return;
    const {data}=await this.sb.auth.getSession();this.user=data.session?data.session.user:null;
    this.sb.auth.onAuthStateChange((_h,ses)=>{const ny=ses&&ses.user?ses.user.id:null;if(ny!==(this.user?this.user.id:null))location.reload()});
    try{sessionStorage.removeItem('pp_tillbaka')}catch(_){}
    if(this.user){
      try{const {data:b}=await this.sb.rpc('matte_jag');this.barn=b&&b[0]||null}catch(_){}
      // Barnet hamnar direkt i sin årskurs första gången.
      if(this.barn&&!localStorage.getItem('mx-profile')){const n=(String(this.barn.arskurs||'').match(/\d+/)||[])[0];const P=n&&PROFILES.find(p=>p.name.endsWith(' '+n));if(P)setProfile(P.id)}
    }
    this.rita();
  }catch(_){}},
  html(){
    if(!this.sb)return '';
    if(!this.user)return `<button class="kbtn" data-konto="in"><svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Logga in med Google</button><span>så sparas resultaten på ditt konto</span>`;
    if(!this.barn&&S.mode==='menu'&&!S.profile)return `<span>☁️ Inloggad som ${esc(this.user.email||'')}</span><button class="klank" data-konto="ut">Logga ut</button><span style="flex-basis:100%;text-align:center">Barnens resultat syns här när du skrivit in deras Google-konton under Familj i <a href="/veckopalten/#/familj">Veckopalten</a>.</span>`;
    return `<span>☁️ Sparas på ${this.barn?esc(this.barn.namn)+'s konto':esc(this.user.email||'ditt konto')}</span><button class="klank" data-konto="ut">Logga ut</button>`},
  rita(){document.querySelectorAll('.kontorad').forEach(el=>el.innerHTML=this.html())},
  async loggaIn(){try{sessionStorage.setItem('pp_tillbaka',location.pathname)}catch(_){}
    const {error}=await this.sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname,queryParams:{prompt:'select_account'}}});
    if(error&&window.PPKonto)PPKonto.toast('Det gick inte att logga in just nu. Försök igen om en stund.')},
  async loggaUt(){await this.sb.auth.signOut();location.reload()},
  // Samma gränssnitt som resultatloggen redan använder (collection/doc/where).
  db(){const sb=this.sb,u=this.user;return {collection:()=>({
    doc:id=>({set:async o=>{const {error}=await sb.from('matte_loggar').upsert({user_id:u.id,id:String(id).slice(0,100),epost:u.email||null,profil:o.profile,dev:o.dev,dag:o.day,ev:o.ev,sparad_at:new Date().toISOString()});if(error)throw error}}),
    where:(_f,_op,pid)=>({get:async()=>{const {data,error}=await sb.from('matte_loggar').select('ev').eq('profil',pid).limit(5000);if(error)throw error;return {docs:(data||[]).map(r=>({data:()=>({ev:r.ev})}))}}})
  })}}
};
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}
document.addEventListener('click',e=>{const b=e.target.closest('[data-konto]');if(!b||!KONTO.sb)return;e.preventDefault();b.dataset.konto==='in'?KONTO.loggaIn():KONTO.loggaUt()});

/* ================= Start ================= */
try{const pid=localStorage.getItem('mx-profile');if(pid&&PROFILES.find(x=>x.id===pid)){S.profile=pid;const P=PROFILES.find(x=>x.id===pid);S.chapter=P.chapters[P.chapters.length-1];TOPICS=CHAPTERS[S.chapter].topics}}catch(_){}
layout();showMenu();LOG.init();
</script>
